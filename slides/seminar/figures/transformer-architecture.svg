<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 820" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="760" height="820" fill="#f5f2ed"/>

  <text x="380" y="30" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">The transformer (Vaswani et al., 2017)</text>
  <text x="380" y="50" font-size="11" fill="#8a8580" text-anchor="middle">Encoder stack, decoder stack, joined by cross-attention. Each sub-layer is wrapped in Add &amp; Norm with a residual connection.</text>

  <defs>
    <marker id="tArr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2b2826"/>
    </marker>
    <marker id="tRedArr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#c03000"/>
    </marker>
    <marker id="tThinArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <polygon points="0 0, 6 3, 0 6" fill="#8a8580"/>
    </marker>
    <!-- Sinusoid icon -->
    <symbol id="sinusoid" viewBox="0 0 28 16" overflow="visible">
      <circle cx="14" cy="8" r="10" fill="#f5f2ed" stroke="#2b2826" stroke-width="1"/>
      <path d="M 6 10 Q 9 4 12 8 T 18 8 T 22 8" stroke="#2b2826" stroke-width="1.2" fill="none"/>
    </symbol>
    <!-- Plus-in-circle -->
    <symbol id="oplus" viewBox="0 0 28 28" overflow="visible">
      <circle cx="14" cy="14" r="12" fill="#f5f2ed" stroke="#2b2826" stroke-width="1.4"/>
      <line x1="6" y1="14" x2="22" y2="14" stroke="#2b2826" stroke-width="1.4"/>
      <line x1="14" y1="6" x2="14" y2="22" stroke="#2b2826" stroke-width="1.4"/>
    </symbol>
  </defs>

  <!-- ================================================================== -->
  <!--                            ENCODER                                 -->
  <!-- ================================================================== -->
  <text x="200" y="90" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" letter-spacing="1.5">ENCODER</text>

  <!-- N× block container (wraps the encoder layer) -->
  <rect x="85" y="345" width="230" height="245" rx="10" fill="none" stroke="#8a8580" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="330" y="465" font-size="14" font-weight="700" fill="#8a8580" letter-spacing="1">N×</text>

  <!-- Top sub-layer: Add & Norm -->
  <rect x="110" y="360" width="180" height="26" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.1"/>
  <text x="200" y="377" font-size="11" font-weight="600" fill="#2b2826" text-anchor="middle">Add &amp; Norm</text>

  <!-- Feed Forward -->
  <rect x="110" y="402" width="180" height="46" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="200" y="421" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Feed</text>
  <text x="200" y="437" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Forward</text>

  <!-- Add & Norm -->
  <rect x="110" y="464" width="180" height="26" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.1"/>
  <text x="200" y="481" font-size="11" font-weight="600" fill="#2b2826" text-anchor="middle">Add &amp; Norm</text>

  <!-- Multi-Head Attention (bottom of encoder layer) -->
  <rect x="110" y="506" width="180" height="56" rx="6" fill="#f5e0c5" stroke="#2b2826" stroke-width="1.2"/>
  <text x="200" y="528" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Multi-Head</text>
  <text x="200" y="546" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Attention</text>

  <!-- Vertical spine: encoder centre line at x=200 -->
  <!-- below MHA: from PE up to MHA bottom -->
  <line x1="200" y1="610" x2="200" y2="566" stroke="#2b2826" stroke-width="1.4"/>
  <!-- three input arrows (Q, K, V projections) into MHA from below -->
  <line x1="180" y1="572" x2="180" y2="566" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <line x1="200" y1="572" x2="200" y2="566" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <line x1="220" y1="572" x2="220" y2="566" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <!-- splitter to the three arrows -->
  <line x1="180" y1="572" x2="220" y2="572" stroke="#2b2826" stroke-width="1.4"/>
  <line x1="200" y1="582" x2="200" y2="572" stroke="#2b2826" stroke-width="1.4"/>

  <!-- between MHA and Add&Norm: short wire -->
  <line x1="200" y1="506" x2="200" y2="494" stroke="#2b2826" stroke-width="1.4"/>
  <line x1="200" y1="494" x2="200" y2="490" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- between Add&Norm1 and FF -->
  <line x1="200" y1="464" x2="200" y2="448" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- between FF and Add&Norm2 -->
  <line x1="200" y1="402" x2="200" y2="390" stroke="#2b2826" stroke-width="1.4"/>
  <line x1="200" y1="390" x2="200" y2="386" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- ABOVE Add&Norm2: exit encoder top -->
  <line x1="200" y1="360" x2="200" y2="320" stroke="#2b2826" stroke-width="1.4"/>

  <!-- Residual arrow around MHA: from below MHA, around RIGHT side, into Add&Norm above -->
  <path d="M 200 582 L 305 582 L 305 477 L 290 477"
        stroke="#8a8580" stroke-width="1.2" fill="none" marker-end="url(#tThinArr)"/>
  <!-- Residual arrow around FF -->
  <path d="M 200 458 L 305 458 L 305 373 L 290 373"
        stroke="#8a8580" stroke-width="1.2" fill="none" marker-end="url(#tThinArr)"/>

  <!-- Positional Encoding ⊕ junction (below the encoder N× block) -->
  <use href="#oplus" x="186" y="610" width="28" height="28"/>
  <!-- sinusoid icon to the LEFT of ⊕ -->
  <use href="#sinusoid" x="120" y="616" width="28" height="16"/>
  <text x="80" y="624" font-size="11" font-weight="600" fill="#2b2826" text-anchor="end">Positional</text>
  <text x="80" y="638" font-size="11" font-weight="600" fill="#2b2826" text-anchor="end">Encoding</text>
  <line x1="148" y1="624" x2="184" y2="624" stroke="#2b2826" stroke-width="1.2" marker-end="url(#tArr)"/>

  <!-- Input Embedding (below ⊕) -->
  <line x1="200" y1="660" x2="200" y2="678" stroke="#2b2826" stroke-width="1.4"/>
  <rect x="130" y="678" width="140" height="34" rx="6" fill="#f9d0d0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="200" y="700" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Input Embedding</text>

  <!-- Inputs label and arrow (pointing up into the embedding) -->
  <line x1="200" y1="744" x2="200" y2="716" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <text x="200" y="762" font-size="12" font-style="italic" fill="#8a8580" text-anchor="middle">Inputs</text>


  <!-- ================================================================== -->
  <!--                            DECODER                                 -->
  <!-- ================================================================== -->
  <text x="560" y="90" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" letter-spacing="1.5">DECODER</text>

  <!-- N× block container -->
  <rect x="445" y="220" width="230" height="370" rx="10" fill="none" stroke="#8a8580" stroke-width="1.4" stroke-dasharray="5,3"/>
  <text x="690" y="405" font-size="14" font-weight="700" fill="#8a8580" letter-spacing="1">N×</text>

  <!-- Top sub-layer: Add & Norm -->
  <rect x="470" y="235" width="180" height="26" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.1"/>
  <text x="560" y="252" font-size="11" font-weight="600" fill="#2b2826" text-anchor="middle">Add &amp; Norm</text>

  <!-- Feed Forward -->
  <rect x="470" y="276" width="180" height="46" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="560" y="295" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Feed</text>
  <text x="560" y="311" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Forward</text>

  <!-- Add & Norm -->
  <rect x="470" y="338" width="180" height="26" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.1"/>
  <text x="560" y="355" font-size="11" font-weight="600" fill="#2b2826" text-anchor="middle">Add &amp; Norm</text>

  <!-- Multi-Head Attention (cross-attention; receives K, V from encoder) -->
  <rect x="470" y="380" width="180" height="56" rx="6" fill="#f5e0c5" stroke="#c03000" stroke-width="2"/>
  <text x="560" y="402" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle">Multi-Head</text>
  <text x="560" y="420" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle">Attention</text>

  <!-- Add & Norm -->
  <rect x="470" y="452" width="180" height="26" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.1"/>
  <text x="560" y="469" font-size="11" font-weight="600" fill="#2b2826" text-anchor="middle">Add &amp; Norm</text>

  <!-- Masked Multi-Head Attention (bottom) -->
  <rect x="470" y="494" width="180" height="56" rx="6" fill="#f5e0c5" stroke="#2b2826" stroke-width="1.2"/>
  <text x="560" y="514" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Masked Multi-Head</text>
  <text x="560" y="532" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Attention</text>

  <!-- Decoder vertical spine -->
  <!-- Below masked MHA: from PE up -->
  <line x1="560" y1="610" x2="560" y2="554" stroke="#2b2826" stroke-width="1.4"/>
  <!-- 3 Q, K, V arrows into masked MHA -->
  <line x1="540" y1="560" x2="540" y2="554" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <line x1="560" y1="560" x2="560" y2="554" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <line x1="580" y1="560" x2="580" y2="554" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <line x1="540" y1="560" x2="580" y2="560" stroke="#2b2826" stroke-width="1.4"/>
  <line x1="560" y1="570" x2="560" y2="560" stroke="#2b2826" stroke-width="1.4"/>

  <!-- between Masked MHA and Add&Norm1 -->
  <line x1="560" y1="494" x2="560" y2="478" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- between Add&Norm1 and Cross-Attn MHA: Q from below -->
  <line x1="560" y1="452" x2="560" y2="436" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <text x="555" y="448" font-size="10" font-weight="700" fill="#c03000" text-anchor="end">Q</text>

  <!-- between Cross-Attn MHA and Add&Norm2 -->
  <line x1="560" y1="380" x2="560" y2="364" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- between Add&Norm2 and FF -->
  <line x1="560" y1="338" x2="560" y2="322" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- between FF and Add&Norm3 -->
  <line x1="560" y1="276" x2="560" y2="261" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <!-- ABOVE the decoder top -->
  <line x1="560" y1="235" x2="560" y2="200" stroke="#2b2826" stroke-width="1.4"/>

  <!-- Residual arrows in decoder (3 sub-layers wrapped in Add&Norm) -->
  <!-- around Masked MHA -->
  <path d="M 560 570 L 665 570 L 665 465 L 650 465"
        stroke="#8a8580" stroke-width="1.2" fill="none" marker-end="url(#tThinArr)"/>
  <!-- around Cross-Attn MHA -->
  <path d="M 560 444 L 670 444 L 670 351 L 650 351"
        stroke="#8a8580" stroke-width="1.2" fill="none" marker-end="url(#tThinArr)"/>
  <!-- around FF -->
  <path d="M 560 330 L 665 330 L 665 248 L 650 248"
        stroke="#8a8580" stroke-width="1.2" fill="none" marker-end="url(#tThinArr)"/>

  <!-- Positional Encoding ⊕ junction (below decoder) -->
  <use href="#oplus" x="546" y="610" width="28" height="28"/>
  <!-- sinusoid icon to the RIGHT of ⊕ -->
  <use href="#sinusoid" x="608" y="616" width="28" height="16"/>
  <text x="680" y="624" font-size="11" font-weight="600" fill="#2b2826" text-anchor="start">Positional</text>
  <text x="680" y="638" font-size="11" font-weight="600" fill="#2b2826" text-anchor="start">Encoding</text>
  <line x1="636" y1="624" x2="576" y2="624" stroke="#2b2826" stroke-width="1.2" marker-end="url(#tArr)"/>

  <!-- Output Embedding (below ⊕) -->
  <line x1="560" y1="660" x2="560" y2="678" stroke="#2b2826" stroke-width="1.4"/>
  <rect x="485" y="678" width="150" height="34" rx="6" fill="#f9d0d0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="560" y="700" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Output Embedding</text>

  <!-- Outputs label and arrow (pointing up into the embedding) -->
  <line x1="560" y1="744" x2="560" y2="716" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>
  <text x="560" y="762" font-size="12" font-style="italic" fill="#8a8580" text-anchor="middle">Outputs (shifted right)</text>


  <!-- ================================================================== -->
  <!--                  TOP: Linear + Softmax → output                    -->
  <!-- ================================================================== -->
  <rect x="510" y="170" width="100" height="28" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="560" y="189" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Linear</text>

  <line x1="560" y1="170" x2="560" y2="158" stroke="#2b2826" stroke-width="1.4" marker-end="url(#tArr)"/>

  <rect x="510" y="128" width="100" height="28" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.2"/>
  <text x="560" y="147" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Softmax</text>

  <line x1="560" y1="128" x2="560" y2="110" stroke="#c03000" stroke-width="2" marker-end="url(#tRedArr)"/>
  <text x="560" y="100" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle">Output Probabilities</text>


  <!-- ================================================================== -->
  <!--   CROSS-ATTENTION: K, V from encoder top → decoder cross-attn       -->
  <!-- ================================================================== -->
  <path d="M 200 320 L 200 200 L 415 200 L 415 410 L 468 410"
        stroke="#c03000" stroke-width="2.4" fill="none" marker-end="url(#tRedArr)"/>
  <text x="305" y="194" font-size="11" font-weight="700" fill="#c03000" text-anchor="middle">K, V from encoder output</text>


  <!-- ================================================================== -->
  <!--                          COLOUR LEGEND                              -->
  <!-- ================================================================== -->
  <g font-size="10" fill="#2b2826">
    <rect x="60" y="785" width="14" height="10" fill="#f5e0c5" stroke="#2b2826" stroke-width="0.6"/>
    <text x="78" y="794">attention</text>
    <rect x="160" y="785" width="14" height="10" fill="#cfe1e0" stroke="#2b2826" stroke-width="0.6"/>
    <text x="178" y="794">feed-forward / linear</text>
    <rect x="330" y="785" width="14" height="10" fill="#e0dcd6" stroke="#2b2826" stroke-width="0.6"/>
    <text x="348" y="794">add &amp; norm</text>
    <rect x="430" y="785" width="14" height="10" fill="#f9d0d0" stroke="#2b2826" stroke-width="0.6"/>
    <text x="448" y="794">embedding</text>
    <rect x="540" y="785" width="14" height="10" fill="none" stroke="#c03000" stroke-width="1.4"/>
    <text x="558" y="794">cross-attention (uses K, V from encoder)</text>
  </g>
</svg>
