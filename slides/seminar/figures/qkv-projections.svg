<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="540" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Q, K, V are three learned projections of the same input</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">The token embedding x_i is multiplied by three learnable matrices. W_Q, W_K, W_V are the parameters that train.</text>

  <!-- ============ ROW 1: QUERY ============ -->
  <text x="60" y="148" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">QUERY</text>

  <text x="184" y="118" font-size="11" fill="#2b2826" text-anchor="middle" font-style="italic" font-weight="700">x_i</text>
  <g>
    <rect x="130" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="148" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="166" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="184" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="202" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="220" y="126" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
  </g>
  <text x="184" y="170" font-size="10" fill="#8a8580" text-anchor="middle" font-style="italic">d_model</text>

  <text x="260" y="148" font-size="24" fill="#2b2826" text-anchor="middle">×</text>

  <rect x="290" y="112" width="84" height="56" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.4"/>
  <text x="332" y="138" font-size="15" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">W_Q</text>
  <text x="332" y="156" font-size="10" fill="#8a8580" text-anchor="middle">d_model × d_k</text>

  <text x="396" y="148" font-size="24" fill="#2b2826" text-anchor="middle">=</text>

  <text x="448" y="118" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic" font-weight="700">q_i</text>
  <g>
    <rect x="418" y="126" width="18" height="28" fill="#e0d4ec" stroke="#c03000" stroke-width="1.4"/>
    <rect x="436" y="126" width="18" height="28" fill="#e0d4ec" stroke="#c03000" stroke-width="1.4"/>
    <rect x="454" y="126" width="18" height="28" fill="#e0d4ec" stroke="#c03000" stroke-width="1.4"/>
    <rect x="472" y="126" width="18" height="28" fill="#e0d4ec" stroke="#c03000" stroke-width="1.4"/>
  </g>
  <text x="448" y="170" font-size="10" fill="#8a8580" text-anchor="middle" font-style="italic">d_k</text>

  <text x="540" y="140" font-size="12" font-style="italic" fill="#2b2826">"what should I look for?"</text>
  <text x="540" y="158" font-size="11" fill="#8a8580" font-style="italic">W_Q learns to extract a question representation</text>

  <!-- ============ ROW 2: KEY ============ -->
  <text x="60" y="261" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">KEY</text>

  <text x="184" y="231" font-size="11" fill="#2b2826" text-anchor="middle" font-style="italic" font-weight="700">x_i</text>
  <g>
    <rect x="130" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="148" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="166" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="184" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="202" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="220" y="239" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
  </g>

  <text x="260" y="261" font-size="24" fill="#2b2826" text-anchor="middle">×</text>

  <rect x="290" y="225" width="84" height="56" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.4"/>
  <text x="332" y="251" font-size="15" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">W_K</text>
  <text x="332" y="269" font-size="10" fill="#8a8580" text-anchor="middle">d_model × d_k</text>

  <text x="396" y="261" font-size="24" fill="#2b2826" text-anchor="middle">=</text>

  <text x="448" y="231" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic" font-weight="700">k_i</text>
  <g>
    <rect x="418" y="239" width="18" height="28" fill="#f5e0c5" stroke="#c03000" stroke-width="1.4"/>
    <rect x="436" y="239" width="18" height="28" fill="#f5e0c5" stroke="#c03000" stroke-width="1.4"/>
    <rect x="454" y="239" width="18" height="28" fill="#f5e0c5" stroke="#c03000" stroke-width="1.4"/>
    <rect x="472" y="239" width="18" height="28" fill="#f5e0c5" stroke="#c03000" stroke-width="1.4"/>
  </g>

  <text x="540" y="253" font-size="12" font-style="italic" fill="#2b2826">"here's the label I advertise"</text>
  <text x="540" y="271" font-size="11" fill="#8a8580" font-style="italic">W_K learns how each token should be matched</text>

  <!-- ============ ROW 3: VALUE ============ -->
  <text x="60" y="374" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">VALUE</text>

  <text x="184" y="344" font-size="11" fill="#2b2826" text-anchor="middle" font-style="italic" font-weight="700">x_i</text>
  <g>
    <rect x="130" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="148" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="166" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="184" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="202" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="220" y="352" width="18" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
  </g>

  <text x="260" y="374" font-size="24" fill="#2b2826" text-anchor="middle">×</text>

  <rect x="290" y="338" width="84" height="56" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.4"/>
  <text x="332" y="364" font-size="15" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">W_V</text>
  <text x="332" y="382" font-size="10" fill="#8a8580" text-anchor="middle">d_model × d_v</text>

  <text x="396" y="374" font-size="24" fill="#2b2826" text-anchor="middle">=</text>

  <text x="448" y="344" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic" font-weight="700">v_i</text>
  <g>
    <rect x="418" y="352" width="18" height="28" fill="#cfe1e0" stroke="#c03000" stroke-width="1.4"/>
    <rect x="436" y="352" width="18" height="28" fill="#cfe1e0" stroke="#c03000" stroke-width="1.4"/>
    <rect x="454" y="352" width="18" height="28" fill="#cfe1e0" stroke="#c03000" stroke-width="1.4"/>
    <rect x="472" y="352" width="18" height="28" fill="#cfe1e0" stroke="#c03000" stroke-width="1.4"/>
  </g>

  <text x="540" y="366" font-size="12" font-style="italic" fill="#2b2826">"here's what I share if attended to"</text>
  <text x="540" y="384" font-size="11" fill="#8a8580" font-style="italic">W_V learns which features get blended into the output</text>

  <!-- Separator -->
  <line x1="60" y1="430" x2="1040" y2="430" stroke="#e0dcd6" stroke-width="1"/>

  <!-- Bottom note: training -->
  <text x="60" y="460" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">HOW ARE W_Q, W_K, W_V TRAINED?</text>
  <text x="60" y="482" font-size="12" fill="#2b2826">All three are parameters of the network, initialised randomly and updated by gradient descent on the training loss,</text>
  <text x="60" y="500" font-size="12" fill="#2b2826">exactly like every other weight (next-token prediction loss, typically). They specialise to whatever projections minimise that loss.</text>

  <text x="60" y="528" font-size="11" font-style="italic" fill="#c03000">Each attention head has its own (W_Q, W_K, W_V), so the same input is projected several ways at once. That is where multi-head attention comes from.</text>
</svg>
