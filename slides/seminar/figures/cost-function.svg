<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="460" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">A vector of mistakes collapses to a single scalar</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Predicted distribution vs. one-hot target; the squared difference at each class summed to a single cost.</text>

  <!-- Panel separators -->
  <line x1="310" y1="90" x2="310" y2="380" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="580" y1="90" x2="580" y2="380" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="800" y1="90" x2="800" y2="380" stroke="#e0dcd6" stroke-width="1"/>

  <!-- Headers -->
  <g font-size="11" font-weight="600" fill="#8a8580" letter-spacing="1.5">
    <text x="170" y="108" text-anchor="middle">PREDICTION   p̂</text>
    <text x="445" y="108" text-anchor="middle">TARGET   y  (digit = 3)</text>
    <text x="690" y="108" text-anchor="middle">SQUARED ERROR   (p̂ − y)²</text>
    <text x="900" y="108" text-anchor="middle">Σ  =  COST</text>
  </g>

  <!-- baseline -->
  <line x1="60" y1="350" x2="800" y2="350" stroke="#8a8580" stroke-width="0.8"/>
  <text x="55" y="354" font-size="10" font-style="italic" fill="#8a8580" text-anchor="end">0</text>
  <text x="55" y="160" font-size="10" font-style="italic" fill="#8a8580" text-anchor="end">1</text>

  <!-- digit labels along bottom -->
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8580" text-anchor="middle">
    <text x="80"  y="368">0</text>
    <text x="105" y="368">1</text>
    <text x="130" y="368">2</text>
    <text x="155" y="368">3</text>
    <text x="180" y="368">4</text>
    <text x="205" y="368">5</text>
    <text x="230" y="368">6</text>
    <text x="255" y="368">7</text>
    <text x="280" y="368">8</text>
    <text x="305" y="368">9</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8580" text-anchor="middle">
    <text x="355" y="368">0</text>
    <text x="380" y="368">1</text>
    <text x="405" y="368">2</text>
    <text x="430" y="368">3</text>
    <text x="455" y="368">4</text>
    <text x="480" y="368">5</text>
    <text x="505" y="368">6</text>
    <text x="530" y="368">7</text>
    <text x="555" y="368">8</text>
    <text x="580" y="368">9</text>
  </g>
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8580" text-anchor="middle">
    <text x="610" y="368">0</text>
    <text x="630" y="368">1</text>
    <text x="650" y="368">2</text>
    <text x="670" y="368">3</text>
    <text x="690" y="368">4</text>
    <text x="710" y="368">5</text>
    <text x="730" y="368">6</text>
    <text x="750" y="368">7</text>
    <text x="770" y="368">8</text>
    <text x="790" y="368">9</text>
  </g>

  <!-- PREDICTION bars (charcoal). probs (sum to 1):
       0.07, 0.05, 0.08, 0.34, 0.06, 0.21, 0.04, 0.05, 0.07, 0.03 -->
  <g fill="#2b2826">
    <rect x="72"  y="336.7" width="16" height="13.3"/>
    <rect x="97"  y="340.5" width="16" height="9.5"/>
    <rect x="122" y="334.8" width="16" height="15.2"/>
    <rect x="147" y="285.4" width="16" height="64.6"/>
    <rect x="172" y="338.6" width="16" height="11.4"/>
    <rect x="197" y="310.1" width="16" height="39.9"/>
    <rect x="222" y="342.4" width="16" height="7.6"/>
    <rect x="247" y="340.5" width="16" height="9.5"/>
    <rect x="272" y="336.7" width="16" height="13.3"/>
    <rect x="297" y="344.3" width="16" height="5.7"/>
  </g>
  <text x="147" y="278" font-size="10" font-family="IBM Plex Mono, monospace" fill="#2b2826" font-weight="700" text-anchor="middle">0.34</text>
  <text x="197" y="303" font-size="10" font-family="IBM Plex Mono, monospace" fill="#8a8580" text-anchor="middle">0.21</text>

  <!-- TARGET bars: only digit 3 = 1, others = 0 -->
  <g fill="#c03000">
    <rect x="422" y="160" width="16" height="190"/>
  </g>
  <g fill="#e0dcd6">
    <rect x="347" y="346" width="16" height="4"/>
    <rect x="372" y="346" width="16" height="4"/>
    <rect x="397" y="346" width="16" height="4"/>
    <rect x="447" y="346" width="16" height="4"/>
    <rect x="472" y="346" width="16" height="4"/>
    <rect x="497" y="346" width="16" height="4"/>
    <rect x="522" y="346" width="16" height="4"/>
    <rect x="547" y="346" width="16" height="4"/>
    <rect x="572" y="346" width="16" height="4"/>
  </g>
  <text x="430" y="152" font-size="10" font-family="IBM Plex Mono, monospace" fill="#c03000" font-weight="700" text-anchor="middle">1.00</text>

  <!-- ERROR bars: (p̂ - y)^2 per class -->
  <!-- Errors: 0.07²=0.0049, 0.05²=0.0025, 0.08²=0.0064, (0.34-1)²=0.4356, 0.06²=0.0036,
                0.21²=0.0441, 0.04²=0.0016, 0.05²=0.0025, 0.07²=0.0049, 0.03²=0.0009 -->
  <!-- For display: scale by 200 (so 0.5 → 100 px height) -->
  <g fill="#2b2826">
    <rect x="603" y="349" width="14" height="1"/>
    <rect x="623" y="349.5" width="14" height="0.5"/>
    <rect x="643" y="349" width="14" height="1.3"/>
    <rect x="683" y="349.3" width="14" height="0.7"/>
    <rect x="703" y="341.2" width="14" height="8.8"/>
    <rect x="723" y="349.7" width="14" height="0.3"/>
    <rect x="743" y="349.5" width="14" height="0.5"/>
    <rect x="763" y="349" width="14" height="1"/>
    <rect x="783" y="349.8" width="14" height="0.2"/>
  </g>
  <rect x="663" y="263" width="14" height="87" fill="#c03000"/>
  <text x="670" y="255" font-size="10" font-family="IBM Plex Mono, monospace" fill="#c03000" font-weight="700" text-anchor="middle">0.44</text>
  <text x="710" y="333" font-size="9" font-family="IBM Plex Mono, monospace" fill="#8a8580" text-anchor="middle">0.04</text>

  <!-- Σ → scalar cost -->
  <text x="900" y="205" font-size="42" font-weight="700" fill="#c03000" text-anchor="middle">0.50</text>
  <text x="900" y="240" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">total loss for this example</text>

  <!-- formulas -->
  <text x="900" y="275" font-family="Lora, Georgia, serif" font-style="italic" font-size="14" fill="#2b2826" text-anchor="middle">L = Σᵢ (p̂ᵢ − yᵢ)²</text>

  <!-- caption -->
  <text x="500" y="430" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">Cross-entropy is the standard alternative for probability targets; both yield smooth, differentiable cost surfaces.</text>
</svg>
