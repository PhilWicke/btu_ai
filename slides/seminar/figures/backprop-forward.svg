<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="460" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Forward pass: how each weight contributes to one output</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Strongly active inputs pulled by larger weights contribute most. To increase the output, nudge weights connected to strongly-active inputs the most.</text>

  <!-- ============ Layer labels ============ -->
  <g font-size="10" font-weight="600" fill="#8a8580" letter-spacing="1.5">
    <text x="170" y="100" text-anchor="middle">PREVIOUS LAYER  a⁽ˡ⁻¹⁾</text>
    <text x="640" y="100" text-anchor="middle">TARGET NEURON  a₂⁽ˡ⁾</text>
  </g>

  <!-- ============ Previous layer: 12 neurons with varying activation ============ -->
  <!-- Activations represented by fill darkness; a few strongly active -->
  <g>
    <!-- (cx, cy, activation_level) -->
  </g>
  <!-- Brute list with manual activations -->
  <!-- helper: dark fills indicate activation -->
  <g stroke="#2b2826" stroke-width="1.2">
    <circle cx="170" cy="130" r="11" fill="#e0dcd6"/>
    <circle cx="170" cy="160" r="11" fill="#9d978f"/>
    <circle cx="170" cy="190" r="11" fill="#e0dcd6"/>
    <circle cx="170" cy="220" r="11" fill="#2b2826"/>
    <circle cx="170" cy="250" r="11" fill="#2b2826"/>
    <circle cx="170" cy="280" r="11" fill="#e0dcd6"/>
    <circle cx="170" cy="310" r="11" fill="#7d7972"/>
    <circle cx="170" cy="340" r="11" fill="#bbb5ad"/>
    <circle cx="170" cy="370" r="11" fill="#e0dcd6"/>
  </g>

  <!-- Activation labels on the left -->
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8580" text-anchor="end">
    <text x="150" y="133">0.04</text>
    <text x="150" y="163">0.42</text>
    <text x="150" y="193">0.10</text>
    <text x="150" y="223" fill="#2b2826" font-weight="700">0.91</text>
    <text x="150" y="253" fill="#2b2826" font-weight="700">0.85</text>
    <text x="150" y="283">0.06</text>
    <text x="150" y="313">0.58</text>
    <text x="150" y="343">0.30</text>
    <text x="150" y="373">0.08</text>
  </g>

  <!-- ============ Target output neuron (large) ============ -->
  <circle cx="640" cy="250" r="42" fill="#fee0cf" stroke="#c03000" stroke-width="2"/>
  <text x="640" y="246" font-size="13" text-anchor="middle" fill="#c03000" font-weight="700">a₂⁽ˡ⁾</text>
  <text x="640" y="262" font-size="10" font-style="italic" text-anchor="middle" fill="#c03000">activation</text>

  <!-- ============ Edges from previous layer to output ============ -->
  <!-- Edge strokes vary in width by weight magnitude. -->
  <!-- For visual, also colour by whether they connect strong activations (high contribution) -->
  <g stroke-linecap="round" fill="none">
    <line x1="181" y1="130" x2="599" y2="246" stroke="#8a8580" stroke-width="1" opacity="0.45"/>
    <line x1="181" y1="160" x2="599" y2="248" stroke="#2b2826" stroke-width="1.8" opacity="0.75"/>
    <line x1="181" y1="190" x2="599" y2="250" stroke="#8a8580" stroke-width="0.8" opacity="0.4"/>
    <!-- Strong contributors -->
    <line x1="181" y1="220" x2="599" y2="252" stroke="#c03000" stroke-width="3" opacity="0.9"/>
    <line x1="181" y1="250" x2="599" y2="254" stroke="#c03000" stroke-width="2.6" opacity="0.85"/>
    <line x1="181" y1="280" x2="599" y2="256" stroke="#8a8580" stroke-width="0.7" opacity="0.35"/>
    <line x1="181" y1="310" x2="599" y2="258" stroke="#2b2826" stroke-width="2" opacity="0.7"/>
    <line x1="181" y1="340" x2="599" y2="260" stroke="#8a8580" stroke-width="1.2" opacity="0.5"/>
    <line x1="181" y1="370" x2="599" y2="262" stroke="#8a8580" stroke-width="0.7" opacity="0.35"/>
  </g>

  <!-- Weight labels along a couple of edges -->
  <g font-family="IBM Plex Mono, monospace" font-size="10" fill="#c03000">
    <text x="370" y="220" font-weight="700">w₄ = 0.74</text>
    <text x="370" y="270" font-weight="700">w₅ = 0.68</text>
  </g>

  <!-- ============ Equation panel above the output ============ -->
  <rect x="490" y="120" width="300" height="58" rx="6" fill="#f5e0c5" stroke="#2b2826" stroke-width="1"/>
  <text x="640" y="146" font-family="Lora, Georgia, serif" font-style="italic" font-size="13" fill="#2b2826" text-anchor="middle">a₂⁽ˡ⁾ = σ( Σᵢ wᵢ · aᵢ⁽ˡ⁻¹⁾ + b )</text>
  <text x="640" y="166" font-size="10" fill="#8a8580" text-anchor="middle" font-style="italic">contribution of weight wᵢ is proportional to aᵢ⁽ˡ⁻¹⁾</text>

  <!-- ============ Three nudge options on the right ============ -->
  <g font-size="11">
    <text x="820" y="200" fill="#2b2826" font-weight="700">three ways to increase a₂⁽ˡ⁾:</text>
    <text x="820" y="232" fill="#c03000">↑ b         &#8226; bias term</text>
    <text x="820" y="258" fill="#c03000">↑ wᵢ        &#8226; weighted by aᵢ</text>
    <text x="820" y="284" fill="#c03000">↑ aᵢ⁽ˡ⁻¹⁾   &#8226; weighted by wᵢ</text>
  </g>

  <!-- ============ Hebbian remark ============ -->
  <text x="500" y="420" font-size="11" font-style="italic" fill="#8a8580" text-anchor="middle">“Cells that fire together wire together.” (Hebb, 1949). Backprop is the quantitative formalisation.</text>
</svg>
