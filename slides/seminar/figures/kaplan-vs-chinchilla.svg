<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="540" fill="#f5f2ed"/>

  <text x="550" y="34" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Chinchilla: for a fixed compute budget, balance parameters and data</text>
  <text x="550" y="52" font-size="11" fill="#8a8580" text-anchor="middle">GPT-3 used 1.7 tokens per parameter. The optimum is closer to 20. A smaller, better-fed model wins.</text>

  <!-- =========== U-CURVE PLOT =========== -->
  <g transform="translate(80 100)">
    <!-- axes -->
    <line x1="0" y1="0" x2="0" y2="320" stroke="#2b2826" stroke-width="1.4"/>
    <line x1="0" y1="320" x2="560" y2="320" stroke="#2b2826" stroke-width="1.4"/>

    <text x="-50" y="160" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" transform="rotate(-90 -50 160)">Loss</text>
    <text x="280" y="358" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Model size (parameters)</text>

    <!-- Two regions shaded -->
    <rect x="0" y="0" width="180" height="320" fill="#cfe1e0" opacity="0.35"/>
    <rect x="380" y="0" width="180" height="320" fill="#fee0cf" opacity="0.45"/>

    <text x="90" y="40" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Too small</text>
    <text x="90" y="58" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">enough data,</text>
    <text x="90" y="72" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">not enough capacity</text>

    <text x="470" y="40" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Too big</text>
    <text x="470" y="58" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">capacity exists,</text>
    <text x="470" y="72" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">not enough data shown</text>

    <!-- U curve, animated draw -->
    <path d="M 20 100 Q 100 230 280 250 Q 460 230 540 100"
          stroke="#2b2826" stroke-width="2" fill="none"
          stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" from="700" to="0" dur="2.4s" fill="freeze" begin="0.4s"/>
    </path>

    <!-- Optimum (compute-optimal frontier valley) marker + label below the curve -->
    <circle cx="280" cy="250" r="9" fill="#c03000" stroke="#2b2826" stroke-width="1.6"/>
    <line x1="280" y1="262" x2="280" y2="296" stroke="#c03000" stroke-width="1"/>
    <text x="280" y="310" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle">compute-optimal frontier</text>
    <text x="280" y="324" font-size="10" font-style="italic" fill="#c03000" text-anchor="middle">≈ 20 tokens per parameter</text>

    <!-- Chinchilla marker (left of optimum, smaller model, near-optimal) -->
    <g>
      <circle cx="180" cy="232" r="6" fill="#c03000" stroke="#2b2826" stroke-width="1.2"/>
      <line x1="180" y1="226" x2="120" y2="190" stroke="#c03000" stroke-width="0.8"/>
      <text x="118" y="180" font-size="11" font-weight="700" fill="#c03000" text-anchor="end">Chinchilla</text>
      <text x="118" y="196" font-size="10" font-style="italic" fill="#c03000" text-anchor="end">70B params · 1.4T tokens</text>
    </g>

    <!-- GPT-3 marker (right of optimum, too big for its data) -->
    <g>
      <circle cx="460" cy="180" r="6" fill="#8a8580" stroke="#2b2826" stroke-width="1.2"/>
      <line x1="460" y1="174" x2="490" y2="148" stroke="#8a8580" stroke-width="0.8"/>
      <text x="492" y="140" font-size="11" font-weight="700" fill="#2b2826">GPT-3</text>
      <text x="492" y="156" font-size="10" font-style="italic" fill="#8a8580">175B params · 300B tokens</text>
      <text x="492" y="170" font-size="10" font-style="italic" fill="#8a8580">1.7 tokens / param</text>
    </g>

    <!-- compute envelope label -->
    <text x="280" y="-8" font-size="10" font-style="italic" fill="#8a8580" text-anchor="middle">all points spend the same compute budget</text>
  </g>

  <!-- =========== TABLE SIDE =========== -->
  <g transform="translate(720 100)">
    <text x="0" y="0" font-size="12" font-weight="700" fill="#2b2826" letter-spacing="1">HOFFMANN ET AL., 2022</text>
    <rect x="0" y="10" width="320" height="3" fill="#c03000"/>

    <text x="0" y="42" font-size="13" font-weight="700" fill="#2b2826">The Chinchilla finding</text>
    <text x="0" y="64" font-size="12" fill="#2b2826">A 70B model trained on 1.4T tokens</text>
    <text x="0" y="80" font-size="12" fill="#2b2826">beats the 175B GPT-3 trained on 300B tokens,</text>
    <text x="0" y="96" font-size="12" fill="#2b2826">at the <tspan font-weight="700" fill="#c03000">same compute cost.</tspan></text>

    <text x="0" y="130" font-size="13" font-weight="700" fill="#2b2826">Rule of thumb</text>
    <text x="0" y="152" font-size="12" fill="#2b2826">Roughly <tspan font-weight="700" font-family="IBM Plex Mono, monospace">20</tspan> training tokens per parameter</text>
    <text x="0" y="168" font-size="12" fill="#2b2826">is compute-optimal.</text>

    <!-- mini table -->
    <g transform="translate(0 190)">
      <rect x="0" y="0" width="320" height="160" fill="#ffffff" stroke="#8a8580" stroke-width="0.8"/>
      <text x="160" y="22" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Tokens per parameter</text>
      <line x1="20" y1="34" x2="300" y2="34" stroke="#e0dcd6" stroke-width="0.8"/>
      <g font-size="12">
        <text x="20" y="58" fill="#2b2826">GPT-3 (2020)</text>
        <text x="300" y="58" fill="#c03000" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">1.7</text>
        <text x="20" y="86" fill="#2b2826">Chinchilla (2022)</text>
        <text x="300" y="86" fill="#2b2826" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">20</text>
        <text x="20" y="114" fill="#2b2826">Llama 2 70B (2023)</text>
        <text x="300" y="114" fill="#2b2826" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">29</text>
        <text x="20" y="142" fill="#2b2826">Llama 3 70B (2024)</text>
        <text x="300" y="142" fill="#c03000" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">214</text>
      </g>
    </g>
    <text x="0" y="370" font-size="10" font-style="italic" fill="#8a8580">Llama 3 overshoots the Chinchilla optimum on purpose:</text>
    <text x="0" y="384" font-size="10" font-style="italic" fill="#8a8580">a slightly worse training trade gives much cheaper inference.</text>
  </g>

  <text x="550" y="515" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">
    A bigger brain does not help if you do not show it enough text. Chinchilla shifted every training run that followed.
  </text>
</svg>
