<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="540" fill="#f5f2ed"/>

  <text x="300" y="34" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">The ReAct loop: Thought · Action · Observation</text>
  <text x="300" y="52" font-size="11" fill="#8a8580" text-anchor="middle">The agent narrates each step. Reasoning lives in the context window: transparent and debuggable.</text>

  <defs>
    <marker id="reactArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#c03000"/>
    </marker>
  </defs>

  <!-- Three boxes around a triangle/loop -->
  <!-- Thought (top) -->
  <g>
    <rect x="220" y="90" width="160" height="60" rx="10" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.6"/>
    <text x="300" y="118" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Thought</text>
    <text x="300" y="138" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">what should I do next?</text>
  </g>

  <!-- Action (bottom right) -->
  <g>
    <rect x="380" y="280" width="160" height="60" rx="10" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
    <text x="460" y="308" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Action</text>
    <text x="460" y="328" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">call a tool with arguments</text>
  </g>

  <!-- Observation (bottom left) -->
  <g>
    <rect x="60" y="280" width="160" height="60" rx="10" fill="#f5e0c5" stroke="#2b2826" stroke-width="1.6"/>
    <text x="140" y="308" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Observation</text>
    <text x="140" y="328" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">read tool result</text>
  </g>

  <!-- Arrows clockwise: Thought -> Action -> Observation -> Thought -->
  <path d="M 380 145 Q 470 200 460 275" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#reactArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <path d="M 380 310 L 225 310" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#reactArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <path d="M 140 275 Q 130 200 220 145" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#reactArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.4s" repeatCount="indefinite"/>
  </path>

  <!-- Final answer break-out (downward from Thought) -->
  <path d="M 300 153 L 300 200 L 200 200" stroke="#8a8580" stroke-width="1.2" stroke-dasharray="3,3" fill="none" marker-end="url(#reactArrow2)"/>
  <defs>
    <marker id="reactArrow2" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#8a8580"/>
    </marker>
  </defs>
  <text x="195" y="195" font-size="10" font-style="italic" fill="#8a8580" text-anchor="end">done? exit with final answer</text>

  <!-- Worked example trace -->
  <g>
    <rect x="40" y="370" width="520" height="130" rx="6" fill="#2b2826"/>
    <text x="56" y="392" font-size="10" font-weight="700" fill="#fee0cf" letter-spacing="1.5">WORKED EXAMPLE — “What is the population of Munich?”</text>
    <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#e0dcd6">
      <text x="56" y="414">Thought:     I need to find the population of Munich.</text>
      <text x="56" y="430">Action:      search_web(&quot;Munich population 2024&quot;)</text>
      <text x="56" y="446">Observation: Munich population is 1.58 million (2024).</text>
      <text x="56" y="462">Thought:     Now I can answer.</text>
      <text x="56" y="478">Action:      final_answer(&quot;Munich has about 1.58M residents.&quot;)</text>
    </g>
  </g>

  <text x="300" y="525" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">This is the agent loop, just narrated out loud. The narration is what makes it auditable.</text>
</svg>
