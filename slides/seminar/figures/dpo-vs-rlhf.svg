<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 420" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="420" fill="#f5f2ed"/>

  <text x="550" y="30" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Classic RLHF vs DPO: collapsing three steps into one</text>
  <text x="550" y="48" font-size="11" fill="#8a8580" text-anchor="middle">DPO skips the reward model. It uses the preference data directly to update the policy with a closed-form loss.</text>

  <defs>
    <marker id="dpoArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#2b2826"/>
    </marker>
  </defs>

  <!-- TOP: Classic RLHF -->
  <g>
    <text x="60" y="92" font-size="12" font-weight="700" fill="#2b2826" letter-spacing="1">CLASSIC RLHF (3 steps)</text>
    <rect x="55" y="100" width="200" height="2" fill="#8a8580"/>

    <!-- preference data -->
    <rect x="55" y="118" width="160" height="50" rx="6" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="135" y="138" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Preference data</text>
    <text x="135" y="155" font-size="10" font-style="italic" fill="#8a8580" text-anchor="middle">(prompt, winner, loser)</text>

    <path d="M 215 143 L 252 143" stroke="#2b2826" stroke-width="1.2" marker-end="url(#dpoArrow)"/>

    <!-- step 1: reward model training -->
    <rect x="255" y="118" width="160" height="50" rx="6" fill="#fee0cf" stroke="#c03000" stroke-width="1.2"/>
    <text x="335" y="138" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Step 1</text>
    <text x="335" y="155" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">train reward model r<tspan baseline-shift="sub" font-size="8">φ</tspan></text>

    <path d="M 415 143 L 452 143" stroke="#2b2826" stroke-width="1.2" marker-end="url(#dpoArrow)"/>

    <!-- step 2: PPO with KL -->
    <rect x="455" y="118" width="160" height="50" rx="6" fill="#fee0cf" stroke="#c03000" stroke-width="1.2"/>
    <text x="535" y="138" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Step 2</text>
    <text x="535" y="155" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">PPO loop with KL leash</text>

    <path d="M 615 143 L 652 143" stroke="#2b2826" stroke-width="1.2" marker-end="url(#dpoArrow)"/>

    <!-- aligned model -->
    <rect x="655" y="118" width="160" height="50" rx="6" fill="#c03000" stroke="#2b2826" stroke-width="1.4"/>
    <text x="735" y="142" font-size="13" font-weight="700" fill="#f5f2ed" text-anchor="middle">Aligned model</text>
    <text x="735" y="157" font-size="10" font-style="italic" fill="#f5f2ed" text-anchor="middle">π<tspan baseline-shift="sub" font-size="8">θ*</tspan></text>

    <!-- moving parts annotations -->
    <g font-size="10" fill="#8a8580" font-style="italic">
      <text x="335" y="190" text-anchor="middle">moving parts:</text>
      <text x="335" y="204" text-anchor="middle">RM + policy + value head</text>
      <text x="535" y="190" text-anchor="middle">stability tricks:</text>
      <text x="535" y="204" text-anchor="middle">clipping, KL coef tuning</text>
    </g>

    <!-- cost callout -->
    <g>
      <rect x="850" y="115" width="220" height="62" rx="6" fill="#ffffff" stroke="#8a8580" stroke-width="0.8"/>
      <text x="864" y="135" font-size="10" font-weight="700" fill="#8a8580" letter-spacing="1">CHARACTERISTICS</text>
      <text x="864" y="151" font-size="11" fill="#2b2826">Three networks in memory</text>
      <text x="864" y="166" font-size="11" fill="#2b2826">RL loop, slower, less stable</text>
    </g>
  </g>

  <!-- middle divider with arrow -->
  <line x1="60" y1="240" x2="1040" y2="240" stroke="#e0dcd6" stroke-width="1"/>
  <text x="550" y="232" font-size="11" font-weight="700" fill="#c03000" text-anchor="middle" letter-spacing="2">DPO (Rafailov et al., 2023)</text>

  <!-- BOTTOM: DPO -->
  <g>
    <text x="60" y="280" font-size="12" font-weight="700" fill="#c03000" letter-spacing="1">DPO (1 step)</text>
    <rect x="55" y="288" width="200" height="2" fill="#c03000"/>

    <!-- preference data -->
    <rect x="55" y="306" width="160" height="50" rx="6" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="135" y="326" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Preference data</text>
    <text x="135" y="343" font-size="10" font-style="italic" fill="#8a8580" text-anchor="middle">(prompt, winner, loser)</text>

    <path d="M 215 331 L 452 331" stroke="#c03000" stroke-width="2" marker-end="url(#dpoArrow)"/>

    <!-- DPO single step -->
    <rect x="455" y="306" width="200" height="50" rx="6" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
    <text x="555" y="326" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle">DPO loss on policy</text>
    <text x="555" y="343" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">closed form, no reward model</text>

    <path d="M 655 331 L 692 331" stroke="#c03000" stroke-width="2" marker-end="url(#dpoArrow)"/>

    <rect x="695" y="306" width="160" height="50" rx="6" fill="#c03000" stroke="#2b2826" stroke-width="1.4"/>
    <text x="775" y="330" font-size="13" font-weight="700" fill="#f5f2ed" text-anchor="middle">Aligned model</text>
    <text x="775" y="345" font-size="10" font-style="italic" fill="#f5f2ed" text-anchor="middle">π<tspan baseline-shift="sub" font-size="8">θ*</tspan></text>

    <!-- cost callout -->
    <g>
      <rect x="870" y="303" width="200" height="62" rx="6" fill="#ffffff" stroke="#c03000" stroke-width="1.2"/>
      <text x="884" y="323" font-size="10" font-weight="700" fill="#c03000" letter-spacing="1">CHARACTERISTICS</text>
      <text x="884" y="339" font-size="11" fill="#2b2826">One network, one loss</text>
      <text x="884" y="354" font-size="11" fill="#2b2826">Same quality, far simpler</text>
    </g>

    <text x="555" y="395" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">The KL leash and the reward signal are folded into one objective. The reward model is gone.</text>
  </g>
</svg>
