<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="540" fill="#f5f2ed"/>

  <text x="300" y="32" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Claude Code: how one prompt becomes a multi-step run</text>
  <text x="300" y="50" font-size="11" fill="#8a8580" text-anchor="middle">The brain decides. Tools execute. The loop continues until the task is done.</text>

  <defs>
    <marker id="ccArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2b2826"/>
    </marker>
  </defs>

  <!-- USER prompt -->
  <g>
    <rect x="40" y="80" width="520" height="40" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1"/>
    <text x="56" y="100" font-size="10" font-weight="700" fill="#8a8580" letter-spacing="1.2">USER PROMPT</text>
    <text x="56" y="115" font-family="IBM Plex Mono, monospace" font-size="11" fill="#2b2826">Find all TODO comments in this project and create a summary.</text>
  </g>

  <path d="M 300 122 L 300 140" stroke="#2b2826" stroke-width="1.4" marker-end="url(#ccArrow)"/>

  <!-- Brain -->
  <g>
    <rect x="200" y="145" width="200" height="50" rx="10" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
    <text x="300" y="170" font-size="14" font-weight="700" fill="#c03000" text-anchor="middle">Brain: Claude</text>
    <text x="300" y="188" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">reasons, plans, decides</text>
  </g>

  <!-- Four resource lanes -->
  <g stroke="#2b2826" stroke-width="1.2" fill="none">
    <path d="M 240 197 L 100 240" marker-end="url(#ccArrow)"/>
    <path d="M 280 197 L 240 240" marker-end="url(#ccArrow)"/>
    <path d="M 320 197 L 360 240" marker-end="url(#ccArrow)"/>
    <path d="M 360 197 L 500 240" marker-end="url(#ccArrow)"/>
  </g>

  <g>
    <rect x="40" y="245" width="120" height="56" rx="6" fill="#cfe1e0" stroke="#2b2826" stroke-width="1"/>
    <text x="100" y="266" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Built-in tools</text>
    <text x="100" y="282" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">read, write, edit,</text>
    <text x="100" y="294" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">bash, grep, search</text>
  </g>
  <g>
    <rect x="180" y="245" width="120" height="56" rx="6" fill="#f5e0c5" stroke="#2b2826" stroke-width="1"/>
    <text x="240" y="266" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">MCP servers</text>
    <text x="240" y="282" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">filesystem, github,</text>
    <text x="240" y="294" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">postgres, custom</text>
  </g>
  <g>
    <rect x="320" y="245" width="120" height="56" rx="6" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="380" y="266" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Sub-agents</text>
    <text x="380" y="282" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">spawned for</text>
    <text x="380" y="294" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">parallel work</text>
  </g>
  <g>
    <rect x="460" y="245" width="100" height="56" rx="6" fill="#fee0cf" stroke="#c03000" stroke-width="1"/>
    <text x="510" y="266" font-size="11" font-weight="700" fill="#2b2826" text-anchor="middle">Web fetch</text>
    <text x="510" y="282" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">docs, packages,</text>
    <text x="510" y="294" font-size="9" font-style="italic" fill="#8a8580" text-anchor="middle">live URLs</text>
  </g>

  <!-- worked trace -->
  <g>
    <rect x="40" y="320" width="520" height="170" rx="6" fill="#2b2826"/>
    <text x="56" y="342" font-size="10" font-weight="700" fill="#fee0cf" letter-spacing="1.5">WORKED TRACE</text>
    <g font-family="IBM Plex Mono, monospace" font-size="11" fill="#e0dcd6">
      <text x="56" y="362">Thought   → I need to search the codebase first.</text>
      <text x="56" y="378">Action    → Grep(&quot;TODO&quot;, all files)</text>
      <text x="56" y="394">Observe   → 14 TODOs found across 6 files.</text>
      <text x="56" y="410">Thought   → Let me read each file for context.</text>
      <text x="56" y="426">Action    → Read(file1), Read(file2), …</text>
      <text x="56" y="442">Observe   → full context for each TODO.</text>
      <text x="56" y="458">Thought   → Now I can synthesise.</text>
      <text x="56" y="474">Action    → Write(&quot;todo-summary.md&quot;)  ✓ done</text>
    </g>
  </g>

  <text x="300" y="512" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">One prompt triggered an autonomous multi-step workflow. The same architecture runs in your terminal today.</text>
</svg>
