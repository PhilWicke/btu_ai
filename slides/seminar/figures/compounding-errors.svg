<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="540" fill="#f5f2ed"/>

  <text x="300" y="32" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">A chatbot mistake is one bad sentence. An agent mistake is a chain.</text>
  <text x="300" y="50" font-size="11" fill="#8a8580" text-anchor="middle">Reliability compounds multiplicatively. Per-step accuracy that looks fine at one step collapses across many.</text>

  <defs>
    <marker id="ceArrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <polygon points="0 0, 8 4, 0 8" fill="#c03000"/>
    </marker>
  </defs>

  <!-- TOP: chatbot single error -->
  <g>
    <text x="40" y="86" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">CHATBOT MISJUDGMENT</text>
    <rect x="40" y="100" width="520" height="50" rx="6" fill="#fee0cf" stroke="#c03000" stroke-width="1.2"/>
    <text x="56" y="124" font-size="12" font-weight="700" fill="#2b2826">Output:</text>
    <text x="56" y="140" font-size="12" font-style="italic" fill="#c03000">“The replication rate in the study was 63%.”  ✗ (it was 36%)</text>
    <text x="56" y="172" font-size="11" font-style="italic" fill="#8a8580">One bad sentence. The user reads it and can verify or move on.</text>
  </g>

  <!-- Separator -->
  <line x1="40" y1="195" x2="560" y2="195" stroke="#e0dcd6" stroke-width="1"/>

  <!-- BOTTOM: agent chain -->
  <g>
    <text x="40" y="222" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">AGENT MISJUDGMENT</text>
    <text x="40" y="237" font-size="10" font-style="italic" fill="#8a8580">Task: “Summarise replication crisis findings and email the team”</text>

    <!-- 5 steps with status -->
    <g>
      <!-- Step 1 OK -->
      <rect x="40" y="250" width="520" height="34" rx="4" fill="#ffffff" stroke="#2b8a4a" stroke-width="1.2"/>
      <text x="56" y="271" font-size="11" font-weight="700" fill="#2b8a4a">Step 1 ✓</text>
      <text x="110" y="271" font-size="11" fill="#2b2826">Search the web for the original Open Science Collaboration paper.</text>
    </g>

    <path d="M 300 287 L 300 297" stroke="#c03000" stroke-width="1.2" marker-end="url(#ceArrow)"/>

    <g>
      <!-- Step 2 ERROR -->
      <rect x="40" y="300" width="520" height="34" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
      <text x="56" y="321" font-size="11" font-weight="700" fill="#c03000">Step 2 ✗</text>
      <text x="110" y="321" font-size="11" fill="#2b2826">OCR misreads the figure: 36% reads as 63%. The error is now in the agent&apos;s context.</text>
    </g>

    <path d="M 300 337 L 300 347" stroke="#c03000" stroke-width="1.2" marker-end="url(#ceArrow)"/>

    <g>
      <!-- Step 3 PROPAGATED -->
      <rect x="40" y="350" width="520" height="34" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.2"/>
      <text x="56" y="371" font-size="11" font-weight="700" fill="#c03000">Step 3 ✗</text>
      <text x="110" y="371" font-size="11" fill="#2b2826">Writes a summary citing 63% as the replication rate.</text>
    </g>

    <path d="M 300 387 L 300 397" stroke="#c03000" stroke-width="1.2" marker-end="url(#ceArrow)"/>

    <g>
      <!-- Step 4 PROPAGATED -->
      <rect x="40" y="400" width="520" height="34" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.2"/>
      <text x="56" y="421" font-size="11" font-weight="700" fill="#c03000">Step 4 ✗</text>
      <text x="110" y="421" font-size="11" fill="#2b2826">Generates a chart with the wrong rate. The chart looks professional and is trusted.</text>
    </g>

    <path d="M 300 437 L 300 447" stroke="#c03000" stroke-width="1.2" marker-end="url(#ceArrow)"/>

    <g>
      <!-- Step 5 SIDE EFFECT -->
      <rect x="40" y="450" width="520" height="40" rx="4" fill="#c03000" stroke="#2b2826" stroke-width="1.4"/>
      <text x="56" y="474" font-size="11" font-weight="700" fill="#f5f2ed">Step 5 ✗ (irreversible)</text>
      <text x="170" y="474" font-size="11" fill="#f5f2ed">Emails the report to the supervisor. The agent stops, task “complete”.</text>
    </g>
  </g>

  <text x="300" y="515" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">One misread compounded into four wrong outputs and one real-world action. Recovery is harder than prevention.</text>
</svg>
