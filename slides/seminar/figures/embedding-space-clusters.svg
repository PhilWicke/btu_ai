<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="500" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Word embeddings, projected to two dimensions</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Semantically related words cluster; analogies become parallel directions. Stylised after t-SNE or PCA projections of trained Word2Vec.</text>

  <!-- Faint axes -->
  <line x1="60" y1="460" x2="940" y2="460" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="60" y1="90" x2="60" y2="460" stroke="#e0dcd6" stroke-width="1"/>

  <!-- Cluster ellipses (faint backgrounds) -->
  <g opacity="0.55">
    <ellipse cx="220" cy="160" rx="120" ry="65" fill="#cfe1d0" stroke="#2a8a3e" stroke-width="1" stroke-dasharray="4,3"/>
    <ellipse cx="200" cy="400" rx="115" ry="50" fill="#f5e0c5" stroke="#c03000" stroke-width="1" stroke-dasharray="4,3"/>
    <ellipse cx="455" cy="400" rx="95" ry="45" fill="#e0d4ec" stroke="#8a8580" stroke-width="1" stroke-dasharray="4,3"/>
    <ellipse cx="700" cy="225" rx="155" ry="115" fill="#cfe1e0" stroke="#2b2826" stroke-width="1" stroke-dasharray="4,3"/>
    <ellipse cx="820" cy="410" rx="95" ry="40" fill="#fee0cf" stroke="#c03000" stroke-width="1" stroke-dasharray="4,3"/>
  </g>

  <!-- Cluster labels (in muted color, top-aligned with each ellipse) -->
  <g font-size="10" font-weight="600" letter-spacing="1.5">
    <text x="220" y="105" fill="#2a8a3e" text-anchor="middle">ANIMALS</text>
    <text x="200" y="358" fill="#c03000" text-anchor="middle">CITIES</text>
    <text x="455" y="355" fill="#8a8580" text-anchor="middle">VERBS</text>
    <text x="700" y="110" fill="#2b2826" text-anchor="middle">PEOPLE  &amp;  ROYALTY</text>
    <text x="820" y="370" fill="#c03000" text-anchor="middle">TECHNOLOGY</text>
  </g>

  <!-- Highlighted analogy: man → woman (gender direction) -->
  <line x1="620" y1="310" x2="620" y2="222" stroke="#c03000" stroke-width="2.2"/>
  <polygon points="620,214 615,226 625,226" fill="#c03000"/>

  <!-- Highlighted analogy: king → queen (parallel, same direction) -->
  <line x1="750" y1="200" x2="750" y2="148" stroke="#c03000" stroke-width="2.2"/>
  <polygon points="750,140 745,152 755,152" fill="#c03000"/>

  <!-- The "gender" direction label, placed above the cluster to avoid label collisions -->
  <text x="685" y="132" font-size="11" font-style="italic" fill="#c03000" text-anchor="middle">gender direction ↓</text>

  <!-- ANIMALS cluster points -->
  <g fill="#2a8a3e">
    <circle cx="195" cy="135" r="3.5"/><text x="200" y="132" font-size="11" fill="#2b2826">cat</text>
    <circle cx="240" cy="150" r="3.5"/><text x="246" y="148" font-size="11" fill="#2b2826">dog</text>
    <circle cx="170" cy="115" r="3.5"/><text x="135" y="118" font-size="11" fill="#2b2826">kitten</text>
    <circle cx="225" cy="180" r="3.5"/><text x="231" y="184" font-size="11" fill="#2b2826">puppy</text>
    <circle cx="285" cy="165" r="3.5"/><text x="291" y="167" font-size="11" fill="#2b2826">wolf</text>
    <circle cx="160" cy="195" r="3.5"/><text x="123" y="200" font-size="11" fill="#2b2826">horse</text>
    <circle cx="280" cy="200" r="3.5"/><text x="286" y="204" font-size="11" fill="#2b2826">rabbit</text>
  </g>

  <!-- CITIES cluster -->
  <g fill="#c03000">
    <circle cx="180" cy="390" r="3.5"/><text x="160" y="385" font-size="11" fill="#2b2826">Paris</text>
    <circle cx="225" cy="405" r="3.5"/><text x="231" y="408" font-size="11" fill="#2b2826">London</text>
    <circle cx="155" cy="420" r="3.5"/><text x="105" y="424" font-size="11" fill="#2b2826">Berlin</text>
    <circle cx="245" cy="425" r="3.5"/><text x="251" y="430" font-size="11" fill="#2b2826">Tokyo</text>
    <circle cx="170" cy="375" r="3.5"/><text x="115" y="370" font-size="11" fill="#2b2826">Madrid</text>
  </g>

  <!-- VERBS cluster -->
  <g fill="#8a8580">
    <circle cx="430" cy="385" r="3.5"/><text x="395" y="383" font-size="11" fill="#2b2826">walk</text>
    <circle cx="475" cy="395" r="3.5"/><text x="481" y="395" font-size="11" fill="#2b2826">run</text>
    <circle cx="420" cy="415" r="3.5"/><text x="380" y="418" font-size="11" fill="#2b2826">swim</text>
    <circle cx="480" cy="420" r="3.5"/><text x="486" y="423" font-size="11" fill="#2b2826">jump</text>
    <circle cx="445" cy="405" r="3.5"/><text x="451" y="405" font-size="11" fill="#2b2826">fly</text>
  </g>

  <!-- PEOPLE & ROYALTY -->
  <g fill="#2b2826">
    <circle cx="620" cy="310" r="4"/><text x="585" y="315" font-size="12" font-weight="600">man</text>
    <circle cx="620" cy="220" r="4"/><text x="568" y="225" font-size="12" font-weight="600">woman</text>
    <circle cx="660" cy="335" r="3.5"/><text x="668" y="338" font-size="11">boy</text>
    <circle cx="660" cy="270" r="3.5"/><text x="668" y="273" font-size="11">girl</text>
    <circle cx="750" cy="200" r="4"/><text x="758" y="204" font-size="12" font-weight="600">king</text>
    <circle cx="750" cy="140" r="4"/><text x="758" y="142" font-size="12" font-weight="700" fill="#c03000">queen</text>
    <circle cx="790" cy="220" r="3.5"/><text x="798" y="223" font-size="11">prince</text>
    <circle cx="790" cy="155" r="3.5"/><text x="798" y="157" font-size="11">princess</text>
    <circle cx="720" cy="250" r="3.5"/><text x="726" y="253" font-size="11">adult</text>
    <circle cx="720" cy="180" r="3.5"/><text x="732" y="183" font-size="11">noble</text>
  </g>

  <!-- TECHNOLOGY -->
  <g fill="#c03000">
    <circle cx="810" cy="395" r="3.5"/><text x="755" y="392" font-size="11" fill="#2b2826">algorithm</text>
    <circle cx="795" cy="420" r="3.5"/><text x="740" y="423" font-size="11" fill="#2b2826">network</text>
    <circle cx="850" cy="410" r="3.5"/><text x="856" y="413" font-size="11" fill="#2b2826">data</text>
    <circle cx="820" cy="430" r="3.5"/><text x="826" y="436" font-size="11" fill="#2b2826">compute</text>
    <circle cx="855" cy="385" r="3.5"/><text x="861" y="388" font-size="11" fill="#2b2826">vector</text>
  </g>

  <!-- caption -->
  <text x="500" y="487" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">No labels were provided to the model; clusters emerge from co-occurrence statistics alone.</text>
</svg>
