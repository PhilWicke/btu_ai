<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="460" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Three encodings of the same words</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Index loses similarity. One-hot loses all relationships. Dense embeddings encode meaning as geometry.</text>

  <line x1="340" y1="90" x2="340" y2="430" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="680" y1="90" x2="680" y2="430" stroke="#e0dcd6" stroke-width="1"/>

  <g font-size="11" font-weight="600" fill="#8a8580" letter-spacing="1.5">
    <text x="170" y="108" text-anchor="middle">1 · INDEX</text>
    <text x="510" y="108" text-anchor="middle">2 · ONE-HOT</text>
    <text x="840" y="108" text-anchor="middle">3 · DENSE EMBEDDING</text>
  </g>

  <!-- ============ Panel 1: Index encoding ============ -->
  <g font-family="IBM Plex Mono, monospace" font-size="14">
    <text x="110" y="160" fill="#2b2826">"the"</text><text x="200" y="160" fill="#8a8580">→</text><text x="245" y="160" fill="#c03000" font-weight="700">1</text>
    <text x="110" y="195" fill="#2b2826">"cat"</text><text x="200" y="195" fill="#8a8580">→</text><text x="245" y="195" fill="#c03000" font-weight="700">13</text>
    <text x="110" y="230" fill="#2b2826">"dog"</text><text x="200" y="230" fill="#8a8580">→</text><text x="245" y="230" fill="#c03000" font-weight="700">23</text>
    <text x="110" y="265" fill="#2b2826">"sat"</text><text x="200" y="265" fill="#8a8580">→</text><text x="245" y="265" fill="#c03000" font-weight="700">9</text>
  </g>

  <text x="170" y="320" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">|cat − dog| = 10</text>
  <text x="170" y="338" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">|cat − sat| = 4</text>
  <text x="170" y="385" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic">spurious ordinal structure</text>

  <!-- ============ Panel 2: One-hot ============ -->
  <g font-family="IBM Plex Mono, monospace" font-size="10">
    <text x="365" y="158" fill="#2b2826" font-size="12">"cat"</text>
    <text x="410" y="158" fill="#8a8580" font-size="13">→</text>
    <rect x="430" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="441" y="160" text-anchor="middle">0</text>
    <rect x="452" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="463" y="160" text-anchor="middle">0</text>
    <rect x="474" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="485" y="160" text-anchor="middle">0</text>
    <rect x="496" y="145" width="22" height="22" fill="#c03000" stroke="#2b2826" stroke-width="1"/><text x="507" y="160" text-anchor="middle" fill="#f5f2ed" font-weight="700">1</text>
    <rect x="518" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="529" y="160" text-anchor="middle">0</text>
    <rect x="540" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="551" y="160" text-anchor="middle">0</text>
    <rect x="562" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="573" y="160" text-anchor="middle">⋯</text>
    <rect x="584" y="145" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="595" y="160" text-anchor="middle">0</text>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10">
    <text x="365" y="198" fill="#2b2826" font-size="12">"dog"</text>
    <text x="410" y="198" fill="#8a8580" font-size="13">→</text>
    <rect x="430" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="441" y="200" text-anchor="middle">0</text>
    <rect x="452" y="185" width="22" height="22" fill="#c03000" stroke="#2b2826" stroke-width="1"/><text x="463" y="200" text-anchor="middle" fill="#f5f2ed" font-weight="700">1</text>
    <rect x="474" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="485" y="200" text-anchor="middle">0</text>
    <rect x="496" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="507" y="200" text-anchor="middle">0</text>
    <rect x="518" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="529" y="200" text-anchor="middle">0</text>
    <rect x="540" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="551" y="200" text-anchor="middle">0</text>
    <rect x="562" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="573" y="200" text-anchor="middle">⋯</text>
    <rect x="584" y="185" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="595" y="200" text-anchor="middle">0</text>
  </g>

  <g font-family="IBM Plex Mono, monospace" font-size="10">
    <text x="365" y="238" fill="#2b2826" font-size="12">"sat"</text>
    <text x="410" y="238" fill="#8a8580" font-size="13">→</text>
    <rect x="430" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="441" y="240" text-anchor="middle">0</text>
    <rect x="452" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="463" y="240" text-anchor="middle">0</text>
    <rect x="474" y="225" width="22" height="22" fill="#c03000" stroke="#2b2826" stroke-width="1"/><text x="485" y="240" text-anchor="middle" fill="#f5f2ed" font-weight="700">1</text>
    <rect x="496" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="507" y="240" text-anchor="middle">0</text>
    <rect x="518" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="529" y="240" text-anchor="middle">0</text>
    <rect x="540" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="551" y="240" text-anchor="middle">0</text>
    <rect x="562" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="573" y="240" text-anchor="middle">⋯</text>
    <rect x="584" y="225" width="22" height="22" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/><text x="595" y="240" text-anchor="middle">0</text>
  </g>

  <text x="510" y="305" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">cos(cat, dog) = 0</text>
  <text x="510" y="323" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">cos(cat, sat) = 0</text>
  <text x="510" y="385" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic">all distinct words equidistant</text>

  <!-- ============ Panel 3: Dense embedding ============ -->
  <g font-family="IBM Plex Mono, monospace" font-size="12">
    <text x="710" y="160" fill="#2b2826">"cat"</text>
    <text x="755" y="160" fill="#8a8580" font-size="13">→</text>
    <text x="780" y="160" fill="#2b2826">[ 0.42, −0.17, 0.85, ⋯ ]</text>

    <text x="710" y="200" fill="#2b2826">"dog"</text>
    <text x="755" y="200" fill="#8a8580" font-size="13">→</text>
    <text x="780" y="200" fill="#2b2826">[ 0.39, −0.20, 0.82, ⋯ ]</text>

    <text x="710" y="240" fill="#2b2826">"sat"</text>
    <text x="755" y="240" fill="#8a8580" font-size="13">→</text>
    <text x="780" y="240" fill="#8a8580">[ −0.65, 0.30, 0.18, ⋯ ]</text>
  </g>

  <text x="840" y="305" font-size="11" fill="#2a8a3e" text-anchor="middle" font-style="italic">cos(cat, dog) = 0.91</text>
  <text x="840" y="323" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">cos(cat, sat) = 0.04</text>
  <text x="840" y="385" font-size="11" fill="#c03000" text-anchor="middle" font-style="italic">nearby vectors = nearby meanings</text>
</svg>
