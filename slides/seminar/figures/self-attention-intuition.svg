<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="540" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Each word builds its own context by looking at the others</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">To interpret "bank" the model attends mostly to "deposited" and "money", the words that pin down the financial sense.</text>

  <!-- ============ Attention arcs ============ -->
  <!-- Sentence baseline at y=260; arcs sweep upward, peak varies with weight -->

  <!-- bank → I (weight 0.03) very thin -->
  <path d="M 772 260 C 772 100 311 100 311 260"
        stroke="#8a8580" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.40"/>
  <text x="540" y="92" font-size="10" fill="#8a8580" text-anchor="middle">α = 0.03</text>

  <!-- bank → deposited (weight 0.42) THICK accent -->
  <path d="M 772 260 C 772 120 413 120 413 260"
        stroke="#c03000" stroke-width="8" fill="none" stroke-linecap="round"/>
  <text x="593" y="112" font-size="12" fill="#c03000" font-weight="700" text-anchor="middle">α = 0.42</text>

  <!-- bank → money (weight 0.31) thick accent -->
  <path d="M 772 260 C 772 150 535 150 535 260"
        stroke="#c03000" stroke-width="6" fill="none" stroke-linecap="round"/>
  <text x="653" y="140" font-size="12" fill="#c03000" font-weight="700" text-anchor="middle">α = 0.31</text>

  <!-- bank → at (weight 0.04) very thin -->
  <path d="M 772 260 C 772 190 619 190 619 260"
        stroke="#8a8580" stroke-width="1.6" fill="none" stroke-linecap="round" opacity="0.45"/>
  <text x="695" y="180" font-size="10" fill="#8a8580" text-anchor="middle">α = 0.04</text>

  <!-- bank → the (weight 0.05) very thin -->
  <path d="M 772 260 C 772 215 689 215 689 260"
        stroke="#8a8580" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.50"/>
  <text x="730" y="205" font-size="10" fill="#8a8580" text-anchor="middle">α = 0.05</text>

  <!-- bank → bank (self-loop, weight 0.15) - leaves the top-left of the bank box, curls over, returns to the top-right with an arrowhead -->
  <path d="M 760 256 C 720 218 720 180 772 180 C 824 180 824 218 790 258"
        stroke="#8a8580" stroke-width="3" fill="none" stroke-linecap="round"/>
  <polygon points="790,258 783,250 795,248" fill="#8a8580"/>
  <text x="772" y="170" font-size="10" fill="#8a8580" font-style="italic" text-anchor="middle">α = 0.15 (self)</text>

  <!-- ============ Sentence row ============ -->
  <g font-size="14" font-weight="500">
    <rect x="293" y="260" width="36" height="36" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="311" y="284" fill="#2b2826" text-anchor="middle">I</text>

    <rect x="353" y="260" width="120" height="36" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.5"/>
    <text x="413" y="284" fill="#2b2826" text-anchor="middle" font-weight="600">deposited</text>

    <rect x="493" y="260" width="84" height="36" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.5"/>
    <text x="535" y="284" fill="#2b2826" text-anchor="middle" font-weight="600">money</text>

    <rect x="597" y="260" width="44" height="36" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="619" y="284" fill="#2b2826" text-anchor="middle">at</text>

    <rect x="661" y="260" width="56" height="36" rx="4" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="689" y="284" fill="#2b2826" text-anchor="middle">the</text>

    <!-- FOCAL "bank" -->
    <rect x="737" y="256" width="70" height="44" rx="4" fill="#c03000" stroke="#2b2826" stroke-width="2">
      <animate attributeName="stroke-width" values="2;2;3.5;2;2" keyTimes="0;0.40;0.55;0.70;1" dur="3.5s" repeatCount="indefinite"/>
    </rect>
    <text x="772" y="284" fill="#f5f2ed" text-anchor="middle" font-weight="700">bank</text>
  </g>
  <text x="772" y="320" font-size="10" font-weight="700" fill="#c03000" text-anchor="middle" letter-spacing="1.5">FOCAL WORD</text>

  <!-- Separator -->
  <line x1="60" y1="345" x2="1040" y2="345" stroke="#e0dcd6" stroke-width="1"/>

  <!-- ============ New representation explained ============ -->
  <text x="60" y="370" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">NEW REPRESENTATION OF "bank"  =  WEIGHTED BLEND OF ALL WORDS</text>

  <!-- Bar chart of contributions, sorted by weight -->
  <g font-family="Inter" font-size="13">
    <!-- deposited -->
    <text x="190" y="403" fill="#2b2826" text-anchor="end" font-weight="600">deposited</text>
    <rect x="200" y="392" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="392" width="361" height="14" fill="#c03000"/>
    <text x="640" y="403" font-family="IBM Plex Mono, monospace" fill="#c03000" font-weight="700">0.42</text>

    <!-- money -->
    <text x="190" y="424" fill="#2b2826" text-anchor="end" font-weight="600">money</text>
    <rect x="200" y="413" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="413" width="266" height="14" fill="#c03000"/>
    <text x="640" y="424" font-family="IBM Plex Mono, monospace" fill="#c03000" font-weight="700">0.31</text>

    <!-- bank (self) -->
    <text x="190" y="445" fill="#2b2826" text-anchor="end" font-style="italic">bank (self)</text>
    <rect x="200" y="434" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="434" width="129" height="14" fill="#8a8580"/>
    <text x="640" y="445" font-family="IBM Plex Mono, monospace" fill="#8a8580">0.15</text>

    <!-- the -->
    <text x="190" y="466" fill="#8a8580" text-anchor="end">the</text>
    <rect x="200" y="455" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="455" width="43" height="14" fill="#8a8580"/>
    <text x="640" y="466" font-family="IBM Plex Mono, monospace" fill="#8a8580">0.05</text>

    <!-- at -->
    <text x="190" y="487" fill="#8a8580" text-anchor="end">at</text>
    <rect x="200" y="476" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="476" width="34" height="14" fill="#8a8580"/>
    <text x="640" y="487" font-family="IBM Plex Mono, monospace" fill="#8a8580">0.04</text>

    <!-- I -->
    <text x="190" y="508" fill="#8a8580" text-anchor="end">I</text>
    <rect x="200" y="497" width="430" height="14" fill="#e0dcd6"/>
    <rect x="200" y="497" width="26" height="14" fill="#8a8580"/>
    <text x="640" y="508" font-family="IBM Plex Mono, monospace" fill="#8a8580">0.03</text>
  </g>

  <!-- side annotation -->
  <text x="700" y="403" font-size="11" fill="#c03000" font-weight="600">←  the two words that</text>
  <text x="700" y="420" font-size="11" fill="#c03000" font-weight="600">    disambiguate "bank"</text>
  <text x="700" y="445" font-size="11" fill="#8a8580" font-style="italic">←  small contribution</text>
  <text x="700" y="460" font-size="11" fill="#8a8580" font-style="italic">    from the word itself</text>
  <text x="700" y="487" font-size="11" fill="#8a8580" font-style="italic">←  function words</text>
  <text x="700" y="503" font-size="11" fill="#8a8580" font-style="italic">    barely matter</text>

  <!-- Bottom caption -->
  <text x="550" y="532" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">
    The financial sense of "bank" is recovered automatically, without a dictionary or rule, from learned attention weights alone.
  </text>
</svg>
