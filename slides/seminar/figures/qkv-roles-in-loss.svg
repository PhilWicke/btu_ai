<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="540" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">The three vectors take asymmetric paths through the loss</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Same operation (× a matrix), but V enters the output directly while Q and K only meet inside a dot product. That difference is what specialises the matrices.</text>

  <!-- ============ Shared input at top ============ -->
  <text x="550" y="100" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5" text-anchor="middle">SAME INPUT</text>
  <g>
    <rect x="494" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="514" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="534" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="554" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="574" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
    <rect x="594" y="108" width="20" height="28" fill="#cfe1d0" stroke="#2b2826" stroke-width="1"/>
  </g>
  <text x="554" y="156" font-size="12" font-style="italic" fill="#2b2826" text-anchor="middle">x_i  (the token embedding)</text>

  <!-- Fan-out arrows down to W_Q, W_K, W_V -->
  <line x1="554" y1="166" x2="240" y2="200" stroke="#8a8580" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="554" y1="166" x2="554" y2="200" stroke="#8a8580" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="554" y1="166" x2="870" y2="200" stroke="#8a8580" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- ============ Three projections row ============ -->
  <!-- q (left) -->
  <rect x="170" y="200" width="140" height="34" rx="5" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.2"/>
  <text x="240" y="222" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">q_i = W_Q · x_i</text>

  <!-- k (centre) -->
  <rect x="484" y="200" width="140" height="34" rx="5" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.2"/>
  <text x="554" y="222" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">k_j = W_K · x_j</text>

  <!-- v (right) -->
  <rect x="800" y="200" width="140" height="34" rx="5" fill="#e0dcd6" stroke="#2b2826" stroke-width="1.2"/>
  <text x="870" y="222" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">v_j = W_V · x_j</text>

  <!-- ============ Q · K paths converge to a dot product ============ -->
  <path d="M 240 234 L 240 274 L 397 274 L 397 296" stroke="#8a8580" stroke-width="1.5" fill="none"/>
  <path d="M 554 234 L 554 274 L 397 274 L 397 296" stroke="#8a8580" stroke-width="1.5" fill="none"/>
  <polygon points="397,300 393,292 401,292" fill="#8a8580"/>

  <!-- Dot product box -->
  <rect x="330" y="300" width="134" height="34" rx="5" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
  <text x="397" y="322" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle" font-style="italic">q_i · k_j / √d_k</text>

  <!-- → softmax -->
  <line x1="464" y1="317" x2="510" y2="317" stroke="#c03000" stroke-width="1.6"/>
  <polygon points="514,317 504,313 504,321" fill="#c03000"/>
  <rect x="514" y="300" width="90" height="34" rx="5" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
  <text x="559" y="322" font-size="12" font-weight="700" fill="#c03000" text-anchor="middle" font-style="italic">softmax</text>

  <!-- → α -->
  <line x1="604" y1="317" x2="640" y2="317" stroke="#c03000" stroke-width="1.6"/>
  <polygon points="644,317 634,313 634,321" fill="#c03000"/>
  <text x="660" y="322" font-size="14" font-weight="700" fill="#c03000" font-style="italic">α_ij</text>

  <!-- Label: Q+K interact only here -->
  <text x="397" y="350" font-size="10" font-style="italic" fill="#c03000" text-anchor="middle">Q and K meet ONLY inside this dot product</text>

  <!-- ============ V path goes direct ============ -->
  <path d="M 870 234 L 870 380 L 820 380" stroke="#2a8a3e" stroke-width="2" fill="none"/>
  <polygon points="816,380 824,376 824,384" fill="#2a8a3e"/>
  <text x="900" y="320" font-size="11" font-style="italic" fill="#2a8a3e" text-anchor="middle">V skips the</text>
  <text x="900" y="335" font-size="11" font-style="italic" fill="#2a8a3e" text-anchor="middle">dot-product step</text>

  <!-- ============ Output ============ -->
  <!-- α path goes to weighted sum -->
  <line x1="660" y1="334" x2="660" y2="378" stroke="#c03000" stroke-width="1.6"/>
  <polygon points="660,382 656,374 664,374" fill="#c03000"/>

  <rect x="600" y="380" width="216" height="40" rx="5" fill="#fee0cf" stroke="#2b2826" stroke-width="1.4"/>
  <text x="708" y="404" font-size="13" font-weight="700" fill="#2b2826" text-anchor="middle" font-style="italic">z_i = Σ_j  α_ij · v_j</text>

  <!-- Output → loss -->
  <line x1="708" y1="420" x2="708" y2="460" stroke="#2b2826" stroke-width="1.5"/>
  <polygon points="708,464 704,456 712,456" fill="#2b2826"/>
  <rect x="660" y="464" width="96" height="30" rx="5" fill="#c03000"/>
  <text x="708" y="484" font-size="14" font-weight="700" fill="#f5f2ed" text-anchor="middle">loss  L</text>

  <!-- ============ Annotations: who learns what from where ============ -->
  <text x="60" y="395" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">GRADIENT TELLS</text>

  <text x="60" y="418" font-size="11" fill="#2b2826"><tspan font-weight="700" fill="#2a8a3e">W_V :</tspan>  &quot;be the content that, blended by α, predicts well.&quot;</text>
  <text x="60" y="438" font-size="11" fill="#2b2826"><tspan font-weight="700" fill="#c03000">W_Q :</tspan>  &quot;produce q's whose dot product with the right k's is large.&quot;</text>
  <text x="60" y="458" font-size="11" fill="#2b2826"><tspan font-weight="700" fill="#c03000">W_K :</tspan>  &quot;produce k's that match the q's of tokens that need you.&quot;</text>

  <!-- ============ Bottom callout: analogy ============ -->
  <line x1="40" y1="500" x2="1060" y2="500" stroke="#e0dcd6" stroke-width="1"/>
  <text x="550" y="525" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">
    The mechanism is one matrix multiplication; the role each output plays in the loss is what selects three different specialisations.
  </text>
</svg>
