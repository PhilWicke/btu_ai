<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="560" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Byte-pair encoding learns subwords iteratively</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">At each step: count every adjacent pair across the corpus; merge the most frequent pair into a new token; repeat. Vocabulary grows; sequences shrink.</text>

  <!-- Row dividers -->
  <line x1="40" y1="100" x2="1060" y2="100" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="40" y1="245" x2="1060" y2="245" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="40" y1="390" x2="1060" y2="390" stroke="#e0dcd6" stroke-width="1"/>

  <!-- ============ ROW 1: ITERATION 0 ============ -->
  <text x="60" y="125" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">ITERATION  0</text>
  <text x="60" y="142" font-size="11" fill="#8a8580" font-style="italic">vocabulary = the alphabet · every character is its own token</text>

  <text x="60" y="200" font-size="11" font-weight="600" fill="#8a8580">tokenise →</text>
  <text x="160" y="200" font-size="13" font-style="italic" fill="#2b2826">"lower"</text>

  <g font-family="IBM Plex Mono, monospace" font-size="13">
    <rect x="240" y="185" width="22" height="22" fill="#2b2826"/>
    <text x="251" y="201" fill="#f5f2ed" text-anchor="middle">l</text>
    <rect x="264" y="185" width="22" height="22" fill="#2b2826"/>
    <text x="275" y="201" fill="#f5f2ed" text-anchor="middle">o</text>
    <rect x="288" y="185" width="22" height="22" fill="#2b2826"/>
    <text x="299" y="201" fill="#f5f2ed" text-anchor="middle">w</text>
    <rect x="312" y="185" width="22" height="22" fill="#2b2826"/>
    <text x="323" y="201" fill="#f5f2ed" text-anchor="middle">e</text>
    <rect x="336" y="185" width="22" height="22" fill="#2b2826"/>
    <text x="347" y="201" fill="#f5f2ed" text-anchor="middle">r</text>
  </g>
  <text x="370" y="201" font-size="11" fill="#8a8580" font-style="italic">5 tokens</text>

  <text x="600" y="200" font-size="11" font-weight="600" fill="#8a8580">vocab</text>
  <text x="650" y="200" font-family="IBM Plex Mono, monospace" font-size="11" fill="#2b2826">{ a, b, c, d, e, f, g, h, … z }</text>
  <text x="900" y="200" font-size="11" fill="#8a8580" font-style="italic">≈ 26 entries</text>

  <text x="60" y="227" font-size="10" fill="#8a8580">most frequent pair across full corpus:</text>
  <text x="260" y="227" font-family="IBM Plex Mono, monospace" font-size="11" fill="#c03000" font-weight="700">l · o</text>
  <text x="295" y="227" font-size="10" fill="#8a8580">→ merge into new token</text>
  <text x="430" y="227" font-family="IBM Plex Mono, monospace" font-size="11" fill="#c03000" font-weight="700">lo</text>

  <!-- ============ ROW 2: ITERATION ~100 ============ -->
  <text x="60" y="270" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1.5">ITERATION  ≈ 100</text>
  <text x="60" y="287" font-size="11" fill="#8a8580" font-style="italic">frequent pairs have merged into subwords · morphology emerges from statistics</text>

  <text x="60" y="345" font-size="11" font-weight="600" fill="#8a8580">tokenise →</text>
  <text x="160" y="345" font-size="13" font-style="italic" fill="#2b2826">"lower"</text>

  <g font-family="IBM Plex Mono, monospace" font-size="13">
    <rect x="240" y="330" width="42" height="22" fill="#c03000"/>
    <text x="261" y="346" fill="#f5f2ed" text-anchor="middle" font-weight="700">low</text>
    <rect x="284" y="330" width="32" height="22" fill="#c03000"/>
    <text x="300" y="346" fill="#f5f2ed" text-anchor="middle" font-weight="700">er</text>
  </g>
  <text x="330" y="346" font-size="11" fill="#8a8580" font-style="italic">2 subword tokens</text>

  <text x="600" y="345" font-size="11" font-weight="600" fill="#8a8580">vocab adds</text>
  <text x="675" y="345" font-family="IBM Plex Mono, monospace" font-size="11" fill="#c03000" font-weight="700">lo, ow, low, er, est, ing, un, …</text>

  <text x="60" y="372" font-size="10" fill="#8a8580" font-style="italic">vocabulary now contains common prefixes (un-), suffixes (-ing, -ness), and stems (play, walk), all learned from the corpus statistics.</text>

  <!-- ============ ROW 3: INFERENCE ============ -->
  <text x="60" y="415" font-size="11" font-weight="700" fill="#2a8a3e" letter-spacing="1.5">AT INFERENCE</text>
  <text x="60" y="432" font-size="11" fill="#8a8580" font-style="italic">apply the learned merge rules to a never-seen word, left to right, deterministically</text>

  <text x="60" y="490" font-size="11" font-weight="600" fill="#8a8580">tokenise →</text>
  <text x="160" y="490" font-size="13" font-style="italic" fill="#2b2826">"unhappiness"</text>

  <g font-family="IBM Plex Mono, monospace" font-size="13">
    <rect x="285" y="475" width="32" height="22" fill="#2a8a3e"/>
    <text x="301" y="491" fill="#f5f2ed" text-anchor="middle" font-weight="700">un</text>
    <rect x="319" y="475" width="60" height="22" fill="#2a8a3e"/>
    <text x="349" y="491" fill="#f5f2ed" text-anchor="middle" font-weight="700">happi</text>
    <rect x="381" y="475" width="44" height="22" fill="#2a8a3e"/>
    <text x="403" y="491" fill="#f5f2ed" text-anchor="middle" font-weight="700">ness</text>
  </g>
  <text x="435" y="491" font-size="11" fill="#8a8580" font-style="italic">3 meaningful subwords</text>

  <!-- Comparison block -->
  <text x="60" y="528" font-size="11" font-weight="600" fill="#8a8580">vs.</text>
  <text x="90" y="528" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8a8580">char-level: u-n-h-a-p-p-i-n-e-s-s</text>
  <text x="330" y="528" font-size="11" fill="#c03000" font-weight="700">11 tokens, no structure</text>

  <text x="540" y="528" font-family="IBM Plex Mono, monospace" font-size="11" fill="#8a8580">word-level: unhappiness</text>
  <text x="740" y="528" font-size="11" fill="#c03000" font-weight="700">OOV: model has no representation</text>
</svg>
