<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="540" fill="#f5f2ed"/>

  <text x="300" y="34" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Multi-agent systems: an orchestrator with specialist workers</text>
  <text x="300" y="52" font-size="11" fill="#8a8580" text-anchor="middle">The intelligence lives in the system, not in any single component. A research team mapped onto agents.</text>

  <defs>
    <marker id="maArrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#2b2826"/>
    </marker>
  </defs>

  <!-- User task -->
  <g>
    <rect x="240" y="80" width="200" height="40" rx="6" fill="#e0dcd6" stroke="#2b2826" stroke-width="1"/>
    <text x="340" y="105" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Open-ended user task</text>
  </g>
  <path d="M 340 120 L 340 145" stroke="#2b2826" stroke-width="1.4" marker-end="url(#maArrow)"/>

  <!-- Orchestrator -->
  <g>
    <rect x="220" y="150" width="240" height="60" rx="10" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
    <text x="340" y="178" font-size="14" font-weight="700" fill="#c03000" text-anchor="middle">Orchestrator agent</text>
    <text x="340" y="196" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">decomposes the task, delegates, aggregates</text>
  </g>

  <!-- Workers (three branches) -->
  <g>
    <path d="M 280 215 L 130 270" stroke="#2b2826" stroke-width="1.4" marker-end="url(#maArrow)"/>
    <path d="M 340 215 L 340 270" stroke="#2b2826" stroke-width="1.4" marker-end="url(#maArrow)"/>
    <path d="M 400 215 L 550 270" stroke="#2b2826" stroke-width="1.4" marker-end="url(#maArrow)"/>

    <text x="200" y="245" font-size="9" fill="#8a8580" font-style="italic" text-anchor="middle">find sources</text>
    <text x="340" y="240" font-size="9" fill="#8a8580" font-style="italic" text-anchor="middle">draft summary</text>
    <text x="480" y="245" font-size="9" fill="#8a8580" font-style="italic" text-anchor="middle">review for errors</text>
  </g>

  <g>
    <rect x="50" y="275" width="160" height="60" rx="8" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.4"/>
    <text x="130" y="298" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Search agent</text>
    <text x="130" y="316" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">web, papers, archives</text>
  </g>
  <g>
    <rect x="260" y="275" width="160" height="60" rx="8" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.4"/>
    <text x="340" y="298" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Synthesis agent</text>
    <text x="340" y="316" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">organises, writes</text>
  </g>
  <g>
    <rect x="470" y="275" width="160" height="60" rx="8" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.4"/>
    <text x="550" y="298" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Critic agent</text>
    <text x="550" y="316" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">checks for errors</text>
  </g>

  <!-- Each worker has its own tool callouts -->
  <g font-size="9" fill="#8a8580" font-style="italic" text-anchor="middle">
    <text x="130" y="358">Tools: search_web, fetch_url, arxiv</text>
    <text x="340" y="358">Tools: read_file, write_file</text>
    <text x="550" y="358">Tools: fact_check, lint</text>
  </g>

  <!-- Return arrows back up -->
  <g stroke="#c03000" stroke-width="1.4" fill="none">
    <path d="M 130 335 Q 130 380 280 215" marker-end="url(#redArr2)"/>
    <path d="M 340 335 Q 340 380 340 215" marker-end="url(#redArr2)" stroke-dasharray="4,3"/>
    <path d="M 550 335 Q 550 380 400 215" marker-end="url(#redArr2)"/>
  </g>
  <defs>
    <marker id="redArr2" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#c03000"/>
    </marker>
  </defs>
  <text x="500" y="394" font-size="9" fill="#c03000" font-style="italic" text-anchor="middle">results stream back to orchestrator</text>

  <!-- Comparison table -->
  <g transform="translate(40 415)">
    <rect x="0" y="0" width="520" height="92" rx="6" fill="#ffffff" stroke="#8a8580" stroke-width="0.8"/>
    <text x="16" y="22" font-size="11" font-weight="700" fill="#2b2826" letter-spacing="1">HUMAN RESEARCH TEAM ↔ AI MULTI-AGENT</text>
    <line x1="16" y1="34" x2="504" y2="34" stroke="#e0dcd6" stroke-width="0.8"/>
    <g font-size="12">
      <text x="20" y="54" fill="#8a8580" font-style="italic">Project manager</text>
      <text x="260" y="54" fill="#2b2826">↔</text>
      <text x="280" y="54" fill="#c03000" font-weight="700">Orchestrator agent</text>
      <text x="20" y="74" fill="#8a8580" font-style="italic">Researcher · Writer · Reviewer</text>
      <text x="260" y="74" fill="#2b2826">↔</text>
      <text x="280" y="74" fill="#c03000" font-weight="700">Search · Synthesis · Critic</text>
    </g>
  </g>

  <text x="300" y="528" font-size="11" font-style="italic" fill="#2b2826" text-anchor="middle">Parallel execution. Specialised context. No single failure point.</text>
</svg>
