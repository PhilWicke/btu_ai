<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="560" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Self-attention for one query position</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">Each token emits Q, K, V; compatibility = scaled Q·K; softmax → weights; output = weighted Σ values.</text>

  <!-- ============ Row labels ============ -->
  <g font-size="11" font-weight="600" fill="#8a8580" letter-spacing="1.5" text-anchor="end">
    <text x="120" y="115">EMBED</text>
    <text x="120" y="167">QUERY</text>
    <text x="120" y="219">KEY</text>
    <text x="120" y="271">VALUE</text>
    <text x="120" y="333">SCORE</text>
    <text x="120" y="375">SCALED</text>
    <text x="120" y="417">SOFTMAX</text>
  </g>

  <!-- ============ Token columns (5 tokens: "the cat sat on mat") ============ -->
  <!-- positions: x = 175, 285, 395, 505, 615  -->
  <g font-size="13" fill="#2b2826" text-anchor="middle">
    <text x="175" y="78">the</text>
    <text x="285" y="78">cat</text>
    <text x="395" y="78">sat</text>
    <text x="505" y="78">on</text>
    <text x="615" y="78">mat</text>
  </g>

  <!-- Embedding boxes (green) -->
  <g stroke="#2b2826" stroke-width="1" fill="#cfe1d0">
    <rect x="150" y="95" width="50" height="30"/>
    <rect x="260" y="95" width="50" height="30"/>
    <rect x="370" y="95" width="50" height="30"/>
    <rect x="480" y="95" width="50" height="30"/>
    <rect x="590" y="95" width="50" height="30"/>
  </g>
  <g font-size="11" fill="#2b2826" text-anchor="middle" font-family="IBM Plex Mono, monospace">
    <text x="175" y="114">x&#8321;</text>
    <text x="285" y="114">x&#8322;</text>
    <text x="395" y="114">x&#8323;</text>
    <text x="505" y="114">x&#8324;</text>
    <text x="615" y="114">x&#8325;</text>
  </g>

  <!-- Query boxes (purple) - highlight x_3 = "sat" as our query token -->
  <g stroke="#2b2826" stroke-width="1" fill="#e0d4ec">
    <rect x="150" y="148" width="50" height="30" opacity="0.5"/>
    <rect x="260" y="148" width="50" height="30" opacity="0.5"/>
    <rect x="370" y="148" width="50" height="30" stroke="#c03000" stroke-width="1.8"/>
    <rect x="480" y="148" width="50" height="30" opacity="0.5"/>
    <rect x="590" y="148" width="50" height="30" opacity="0.5"/>
  </g>
  <g font-size="11" fill="#2b2826" text-anchor="middle" font-family="IBM Plex Mono, monospace">
    <text x="175" y="167" opacity="0.4">q&#8321;</text>
    <text x="285" y="167" opacity="0.4">q&#8322;</text>
    <text x="395" y="167" fill="#c03000" font-weight="700">q&#8323;</text>
    <text x="505" y="167" opacity="0.4">q&#8324;</text>
    <text x="615" y="167" opacity="0.4">q&#8325;</text>
  </g>

  <!-- Key boxes (orange) -->
  <g stroke="#2b2826" stroke-width="1" fill="#f5e0c5">
    <rect x="150" y="200" width="50" height="30"/>
    <rect x="260" y="200" width="50" height="30"/>
    <rect x="370" y="200" width="50" height="30"/>
    <rect x="480" y="200" width="50" height="30"/>
    <rect x="590" y="200" width="50" height="30"/>
  </g>
  <g font-size="11" fill="#2b2826" text-anchor="middle" font-family="IBM Plex Mono, monospace">
    <text x="175" y="219">k&#8321;</text>
    <text x="285" y="219">k&#8322;</text>
    <text x="395" y="219">k&#8323;</text>
    <text x="505" y="219">k&#8324;</text>
    <text x="615" y="219">k&#8325;</text>
  </g>

  <!-- Value boxes (blue) -->
  <g stroke="#2b2826" stroke-width="1" fill="#cfe1e0">
    <rect x="150" y="252" width="50" height="30"/>
    <rect x="260" y="252" width="50" height="30"/>
    <rect x="370" y="252" width="50" height="30"/>
    <rect x="480" y="252" width="50" height="30"/>
    <rect x="590" y="252" width="50" height="30"/>
  </g>
  <g font-size="11" fill="#2b2826" text-anchor="middle" font-family="IBM Plex Mono, monospace">
    <text x="175" y="271">v&#8321;</text>
    <text x="285" y="271">v&#8322;</text>
    <text x="395" y="271">v&#8323;</text>
    <text x="505" y="271">v&#8324;</text>
    <text x="615" y="271">v&#8325;</text>
  </g>

  <!-- Score row: q3 · k_i -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#2b2826" text-anchor="middle">
    <text x="175" y="335">1.2</text>
    <text x="285" y="335">8.4</text>
    <text x="395" y="335">9.1</text>
    <text x="505" y="335">0.7</text>
    <text x="615" y="335">3.2</text>
  </g>
  <text x="650" y="335" font-size="10" fill="#8a8580" font-style="italic">= q&#8323; · k&#7522;</text>

  <!-- Scaled (divided by sqrt(d_k), say sqrt(64)=8) -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" fill="#8a8580" text-anchor="middle">
    <text x="175" y="377">0.15</text>
    <text x="285" y="377">1.05</text>
    <text x="395" y="377">1.14</text>
    <text x="505" y="377">0.09</text>
    <text x="615" y="377">0.40</text>
  </g>
  <text x="650" y="377" font-size="10" fill="#8a8580" font-style="italic">/ √d&#8342;</text>

  <!-- Softmax weights -->
  <g font-family="IBM Plex Mono, monospace" font-size="12" text-anchor="middle">
    <text x="175" y="419" fill="#8a8580">0.06</text>
    <text x="285" y="419" fill="#2b2826" font-weight="600">0.37</text>
    <text x="395" y="419" fill="#c03000" font-weight="700">0.41</text>
    <text x="505" y="419" fill="#8a8580">0.06</text>
    <text x="615" y="419" fill="#8a8580">0.10</text>
  </g>

  <!-- Softmax weight bars (visual) -->
  <g>
    <rect x="155" y="430" width="40" height="6" fill="#e0dcd6"/>
    <rect x="155" y="430" width="2.4" height="6" fill="#8a8580"/>
    <rect x="265" y="430" width="40" height="6" fill="#e0dcd6"/>
    <rect x="265" y="430" width="14.8" height="6" fill="#2b2826"/>
    <rect x="375" y="430" width="40" height="6" fill="#e0dcd6"/>
    <rect x="375" y="430" width="16.4" height="6" fill="#c03000"/>
    <rect x="485" y="430" width="40" height="6" fill="#e0dcd6"/>
    <rect x="485" y="430" width="2.4" height="6" fill="#8a8580"/>
    <rect x="595" y="430" width="40" height="6" fill="#e0dcd6"/>
    <rect x="595" y="430" width="4" height="6" fill="#8a8580"/>
  </g>

  <!-- ============ Output line ============ -->
  <line x1="135" y1="465" x2="660" y2="465" stroke="#e0dcd6" stroke-width="1"/>

  <!-- Output for q3: weighted sum of values -->
  <text x="120" y="500" font-size="11" font-weight="600" fill="#8a8580" letter-spacing="1.5" text-anchor="end">OUTPUT</text>
  <text x="170" y="500" font-family="Lora, Georgia, serif" font-style="italic" font-size="14" fill="#2b2826">z&#8323; =</text>
  <text x="230" y="500" font-family="IBM Plex Mono, monospace" font-size="12" fill="#8a8580">0.06·v&#8321; + 0.37·v&#8322; +</text>
  <text x="420" y="500" font-family="IBM Plex Mono, monospace" font-size="12" fill="#c03000" font-weight="700">0.41·v&#8323;</text>
  <text x="490" y="500" font-family="IBM Plex Mono, monospace" font-size="12" fill="#8a8580">+ 0.06·v&#8324; + 0.10·v&#8325;</text>

  <text x="500" y="535" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">A context-sensitive representation of "sat", built from the whole sentence and weighted by relevance.</text>
</svg>
