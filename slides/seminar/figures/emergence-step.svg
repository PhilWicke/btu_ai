<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="540" fill="#f5f2ed"/>

  <text x="550" y="34" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Emergence: same data, two different scoring rules</text>
  <text x="550" y="52" font-size="11" fill="#8a8580" text-anchor="middle">The sharpness depends on the metric. Pass/fail makes a step. A continuous metric makes a curve.</text>

  <!-- =========== LEFT PLOT: PASS/FAIL =========== -->
  <g transform="translate(80 100)">
    <!-- title -->
    <text x="220" y="0" font-size="13" font-weight="700" fill="#c03000" text-anchor="middle" letter-spacing="1">SCORED PASS / FAIL</text>
    <text x="220" y="18" font-size="10" font-style="italic" fill="#8a8580" text-anchor="middle">exact match: either the whole answer is right or it is wrong</text>

    <!-- axes -->
    <line x1="0" y1="40" x2="0" y2="320" stroke="#2b2826" stroke-width="1.4"/>
    <line x1="0" y1="320" x2="440" y2="320" stroke="#2b2826" stroke-width="1.4"/>

    <text x="-40" y="180" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" transform="rotate(-90 -40 180)">Accuracy</text>
    <text x="220" y="355" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Model scale (log params)</text>

    <!-- ticks -->
    <g font-size="9" fill="#8a8580" text-anchor="middle">
      <text x="0" y="338">1B</text>
      <text x="110" y="338">10B</text>
      <text x="220" y="338">100B</text>
      <text x="330" y="338">1T</text>
    </g>
    <g font-size="9" fill="#8a8580" text-anchor="end">
      <text x="-5" y="324">0%</text>
      <text x="-5" y="180" >50%</text>
      <text x="-5" y="44">100%</text>
    </g>

    <!-- step curve, animated draw -->
    <path d="M 0 318 L 220 318 L 240 60 L 440 50"
          stroke="#c03000" stroke-width="3" fill="none" stroke-linejoin="round"
          stroke-dasharray="700" stroke-dashoffset="700">
      <animate attributeName="stroke-dashoffset" from="700" to="0" dur="2.4s" fill="freeze" begin="0.3s"/>
    </path>

    <!-- threshold marker -->
    <line x1="220" y1="40" x2="220" y2="320" stroke="#8a8580" stroke-width="0.8" stroke-dasharray="4,4"/>
    <text x="220" y="32" font-size="10" fill="#8a8580" text-anchor="middle">apparent threshold</text>

    <!-- annotation -->
    <text x="80" y="280" font-size="11" fill="#2b2826" font-style="italic">near zero</text>
    <text x="80" y="294" font-size="11" fill="#2b2826" font-style="italic">below threshold</text>

    <text x="360" y="92" font-size="11" fill="#c03000" font-weight="700">sudden jump</text>
    <text x="360" y="106" font-size="10" fill="#c03000" font-style="italic">looks "emergent"</text>
  </g>

  <!-- VS divider -->
  <line x1="545" y1="120" x2="545" y2="430" stroke="#e0dcd6" stroke-width="1"/>
  <rect x="528" y="218" width="34" height="22" fill="#f5f2ed"/>
  <text x="545" y="234" font-size="15" font-weight="700" fill="#8a8580" text-anchor="middle" letter-spacing="2">VS</text>

  <!-- =========== RIGHT PLOT: CONTINUOUS =========== -->
  <g transform="translate(640 100)">
    <text x="220" y="0" font-size="13" font-weight="700" fill="#2b2826" text-anchor="middle" letter-spacing="1">SCORED CONTINUOUSLY</text>
    <text x="220" y="18" font-size="10" font-style="italic" fill="#8a8580" text-anchor="middle">log-likelihood, edit distance, partial credit. Smooth.</text>

    <line x1="0" y1="40" x2="0" y2="320" stroke="#2b2826" stroke-width="1.4"/>
    <line x1="0" y1="320" x2="440" y2="320" stroke="#2b2826" stroke-width="1.4"/>

    <text x="-40" y="180" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle" transform="rotate(-90 -40 180)">Likelihood of correct answer</text>
    <text x="220" y="355" font-size="12" font-weight="700" fill="#2b2826" text-anchor="middle">Model scale (log params)</text>

    <g font-size="9" fill="#8a8580" text-anchor="middle">
      <text x="0" y="338">1B</text>
      <text x="110" y="338">10B</text>
      <text x="220" y="338">100B</text>
      <text x="330" y="338">1T</text>
    </g>
    <g font-size="9" fill="#8a8580" text-anchor="end">
      <text x="-5" y="324">low</text>
      <text x="-5" y="44">high</text>
    </g>

    <!-- smooth power-law curve, animated draw -->
    <path d="M 0 305 Q 80 280 160 240 Q 240 195 320 145 Q 380 110 440 80"
          stroke="#2b2826" stroke-width="3" fill="none"
          stroke-dasharray="600" stroke-dashoffset="600">
      <animate attributeName="stroke-dashoffset" from="600" to="0" dur="2.4s" fill="freeze" begin="0.3s"/>
    </path>

    <text x="100" y="200" font-size="11" fill="#2b2826" font-style="italic">smooth, predictable</text>
    <text x="100" y="214" font-size="11" fill="#2b2826" font-style="italic">improvement throughout</text>

    <text x="270" y="120" font-size="11" font-weight="700" fill="#2b2826">no jump</text>
    <text x="270" y="134" font-size="10" font-style="italic" fill="#8a8580">just power-law decay</text>
  </g>

  <!-- =========== BOTTOM TAKEAWAY =========== -->
  <g transform="translate(80 470)">
    <rect x="0" y="0" width="940" height="42" rx="6" fill="#ffffff" stroke="#c03000" stroke-width="1.2"/>
    <text x="20" y="20" font-size="11" font-weight="700" fill="#c03000" letter-spacing="1">SCHAEFFER ET AL., 2023</text>
    <text x="20" y="35" font-size="12" fill="#2b2826">Many emergent abilities are an artefact of nonlinear scoring. Switching to a continuous metric often makes the threshold disappear.</text>
  </g>
</svg>
