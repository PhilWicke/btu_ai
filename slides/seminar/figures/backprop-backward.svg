<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1000" height="460" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Backward pass: gradients propagate to every weight</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">The loss is differentiated backwards through the network via the chain rule. Each weight receives a nudge proportional to how much it changes the loss.</text>

  <!-- Layer x positions -->
  <!-- Input layer at 130, H1 at 320, H2 at 510, Output at 700, Loss at 880 -->

  <g font-size="10" font-weight="600" fill="#8a8580" letter-spacing="1.5" text-anchor="middle">
    <text x="130" y="100">INPUT</text>
    <text x="320" y="100">HIDDEN 1</text>
    <text x="510" y="100">HIDDEN 2</text>
    <text x="700" y="100">OUTPUT</text>
    <text x="880" y="100">LOSS</text>
  </g>

  <!-- Layer nodes -->
  <g stroke="#2b2826" stroke-width="1.2" fill="#cfe1d0">
    <circle cx="130" cy="160" r="10"/>
    <circle cx="130" cy="200" r="10"/>
    <circle cx="130" cy="240" r="10"/>
    <circle cx="130" cy="280" r="10"/>
    <circle cx="130" cy="320" r="10"/>
  </g>
  <g stroke="#2b2826" stroke-width="1.2" fill="#cfe1e0">
    <circle cx="320" cy="160" r="10"/>
    <circle cx="320" cy="200" r="10"/>
    <circle cx="320" cy="240" r="10"/>
    <circle cx="320" cy="280" r="10"/>
    <circle cx="320" cy="320" r="10"/>
  </g>
  <g stroke="#2b2826" stroke-width="1.2" fill="#cfe1e0">
    <circle cx="510" cy="160" r="10"/>
    <circle cx="510" cy="200" r="10"/>
    <circle cx="510" cy="240" r="10"/>
    <circle cx="510" cy="280" r="10"/>
    <circle cx="510" cy="320" r="10"/>
  </g>
  <g stroke="#2b2826" stroke-width="1.2" fill="#fee0cf">
    <circle cx="700" cy="220" r="10"/>
    <circle cx="700" cy="260" r="10"/>
  </g>
  <!-- Loss node -->
  <rect x="855" y="225" width="60" height="36" rx="6" fill="#c03000"/>
  <text x="885" y="248" font-size="14" fill="#f5f2ed" text-anchor="middle" font-weight="700">L</text>

  <!-- Faint forward connections (left to right) -->
  <g stroke="#8a8580" stroke-width="0.4" opacity="0.25">
    <!-- input → H1 -->
    <line x1="140" y1="160" x2="310" y2="160"/><line x1="140" y1="160" x2="310" y2="200"/><line x1="140" y1="200" x2="310" y2="160"/><line x1="140" y1="200" x2="310" y2="240"/>
    <line x1="140" y1="240" x2="310" y2="200"/><line x1="140" y1="240" x2="310" y2="280"/><line x1="140" y1="280" x2="310" y2="240"/><line x1="140" y1="280" x2="310" y2="320"/>
    <line x1="140" y1="320" x2="310" y2="280"/><line x1="140" y1="320" x2="310" y2="320"/>
    <!-- H1 → H2 -->
    <line x1="330" y1="160" x2="500" y2="160"/><line x1="330" y1="200" x2="500" y2="200"/><line x1="330" y1="240" x2="500" y2="240"/><line x1="330" y1="280" x2="500" y2="280"/><line x1="330" y1="320" x2="500" y2="320"/>
    <line x1="330" y1="160" x2="500" y2="240"/><line x1="330" y1="320" x2="500" y2="240"/>
    <!-- H2 → output -->
    <line x1="520" y1="160" x2="690" y2="220"/><line x1="520" y1="200" x2="690" y2="220"/><line x1="520" y1="240" x2="690" y2="220"/>
    <line x1="520" y1="240" x2="690" y2="260"/><line x1="520" y1="280" x2="690" y2="260"/><line x1="520" y1="320" x2="690" y2="260"/>
    <!-- output → L -->
    <line x1="710" y1="220" x2="855" y2="240"/>
    <line x1="710" y1="260" x2="855" y2="246"/>
  </g>

  <!-- ============ Backward arrows (the gradient flow) ============ -->
  <!-- L → output -->
  <g stroke="#c03000" stroke-width="2.2" fill="#c03000" stroke-linecap="round">
    <line x1="852" y1="234" x2="720" y2="218"/>
    <polygon points="713,217 723,213 722,222"/>
    <line x1="852" y1="252" x2="720" y2="262"/>
    <polygon points="713,263 723,257 722,267"/>
  </g>
  <text x="785" y="208" font-size="10" font-style="italic" fill="#c03000" font-weight="700">∂L/∂a⁽ᴸ⁾</text>

  <!-- output → H2 (thicker if gradient is large) -->
  <g stroke="#c03000" stroke-width="1.6" stroke-opacity="0.75" stroke-linecap="round" fill="#c03000">
    <line x1="690" y1="220" x2="525" y2="160"/><polygon points="520,158 530,156 528,165"/>
    <line x1="690" y1="225" x2="525" y2="200"/><polygon points="520,200 529,196 528,205"/>
    <line x1="690" y1="240" x2="525" y2="240"/><polygon points="520,240 528,236 528,245"/>
    <line x1="690" y1="255" x2="525" y2="280"/><polygon points="520,281 529,277 528,286"/>
    <line x1="690" y1="265" x2="525" y2="320"/><polygon points="520,321 529,317 528,326"/>
  </g>
  <text x="600" y="195" font-size="10" font-style="italic" fill="#c03000" font-weight="700">δ⁽ᴸ⁻¹⁾</text>

  <!-- H2 → H1 -->
  <g stroke="#c03000" stroke-width="1.2" stroke-opacity="0.55" stroke-linecap="round" fill="#c03000">
    <line x1="500" y1="160" x2="335" y2="160"/><polygon points="330,160 338,156 338,165"/>
    <line x1="500" y1="200" x2="335" y2="200"/><polygon points="330,200 338,196 338,205"/>
    <line x1="500" y1="240" x2="335" y2="240"/><polygon points="330,240 338,236 338,245"/>
    <line x1="500" y1="280" x2="335" y2="280"/><polygon points="330,280 338,276 338,285"/>
    <line x1="500" y1="320" x2="335" y2="320"/><polygon points="330,320 338,316 338,325"/>
  </g>
  <text x="410" y="155" font-size="10" font-style="italic" fill="#c03000" font-weight="700">δ⁽ᴸ⁻²⁾</text>

  <!-- H1 → input -->
  <g stroke="#c03000" stroke-width="0.9" stroke-opacity="0.4" stroke-linecap="round" fill="#c03000">
    <line x1="310" y1="160" x2="145" y2="160"/><polygon points="140,160 148,156 148,165"/>
    <line x1="310" y1="200" x2="145" y2="200"/><polygon points="140,200 148,196 148,205"/>
    <line x1="310" y1="240" x2="145" y2="240"/><polygon points="140,240 148,236 148,245"/>
    <line x1="310" y1="280" x2="145" y2="280"/><polygon points="140,280 148,276 148,285"/>
    <line x1="310" y1="320" x2="145" y2="320"/><polygon points="140,320 148,316 148,325"/>
  </g>

  <!-- ============ Equations strip ============ -->
  <g font-family="Lora, Georgia, serif" font-style="italic" font-size="13" fill="#2b2826">
    <text x="500" y="385" text-anchor="middle">δ⁽ˡ⁾ = (W⁽ˡ⁺¹⁾)ᵀ δ⁽ˡ⁺¹⁾ ⊙ σ′(z⁽ˡ⁾)        ∂L/∂Wᵢⱼ⁽ˡ⁾ = δᵢ⁽ˡ⁾ · aⱼ⁽ˡ⁻¹⁾</text>
  </g>

  <!-- Final caption -->
  <text x="500" y="420" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">Each weight’s contribution to the loss decomposes into a downstream error term δ and an upstream activation a.</text>
  <text x="500" y="438" font-size="11" fill="#8a8580" text-anchor="middle" font-style="italic">Average over the mini-batch → the gradient used by SGD.</text>
</svg>
