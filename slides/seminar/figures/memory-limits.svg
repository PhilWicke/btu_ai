<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="1100" height="480" fill="#f5f2ed"/>

  <text x="550" y="30" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Two kinds of memory limit: training cutoff and context window</text>
  <text x="550" y="48" font-size="11" fill="#8a8580" text-anchor="middle">The cutoff is a frozen library. The context window is a finite scratchpad. Both motivate external tools.</text>

  <!-- LEFT: knowledge cutoff timeline -->
  <g>
    <text x="40" y="84" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">KNOWLEDGE CUTOFF</text>

    <!-- timeline -->
    <line x1="60" y1="200" x2="500" y2="200" stroke="#2b2826" stroke-width="2"/>

    <!-- training data zone -->
    <rect x="60" y="180" width="280" height="40" fill="#cfe1e0" opacity="0.65"/>
    <text x="200" y="174" font-size="10" font-weight="700" fill="#2b2826" text-anchor="middle" letter-spacing="1">TRAINING DATA INCLUDED</text>

    <!-- cutoff marker -->
    <line x1="340" y1="160" x2="340" y2="240" stroke="#c03000" stroke-width="3"/>
    <text x="340" y="155" font-size="11" font-weight="700" fill="#c03000" text-anchor="middle">cutoff</text>
    <circle cx="340" cy="200" r="6" fill="#c03000" stroke="#2b2826" stroke-width="1.4"/>

    <!-- post-cutoff zone (greyed) -->
    <rect x="340" y="180" width="160" height="40" fill="#e0dcd6" opacity="0.45"/>
    <text x="420" y="174" font-size="10" font-weight="700" fill="#8a8580" text-anchor="middle" letter-spacing="1">INVISIBLE TO WEIGHTS</text>

    <!-- date markers -->
    <g font-size="9" fill="#8a8580" text-anchor="middle">
      <line x1="100" y1="200" x2="100" y2="208" stroke="#8a8580"/>
      <text x="100" y="222">2020</text>
      <line x1="180" y1="200" x2="180" y2="208" stroke="#8a8580"/>
      <text x="180" y="222">2022</text>
      <line x1="260" y1="200" x2="260" y2="208" stroke="#8a8580"/>
      <text x="260" y="222">2023</text>
      <text x="340" y="252" font-weight="700" fill="#c03000">GPT-4: Apr 2023</text>
      <line x1="420" y1="200" x2="420" y2="208" stroke="#8a8580"/>
      <text x="420" y="222">2024</text>
      <line x1="490" y1="200" x2="490" y2="208" stroke="#8a8580"/>
      <text x="490" y="222">2025</text>
    </g>

    <!-- events on each side -->
    <g font-size="10" fill="#2b2826">
      <text x="100" y="280" text-anchor="middle">✓ knows</text>
      <text x="100" y="294" text-anchor="middle" font-style="italic" fill="#8a8580">2020 Olympics</text>
      <text x="180" y="280" text-anchor="middle">✓ knows</text>
      <text x="180" y="294" text-anchor="middle" font-style="italic" fill="#8a8580">ChatGPT launch</text>
      <text x="260" y="280" text-anchor="middle">✓ knows</text>
      <text x="260" y="294" text-anchor="middle" font-style="italic" fill="#8a8580">GPT-4 paper</text>

      <text x="395" y="280" text-anchor="middle" fill="#c03000" font-weight="700">✗ blind to</text>
      <text x="395" y="294" text-anchor="middle" font-style="italic" fill="#c03000">2024 election</text>
      <text x="490" y="280" text-anchor="middle" fill="#c03000" font-weight="700">✗ blind to</text>
      <text x="490" y="294" text-anchor="middle" font-style="italic" fill="#c03000">today&apos;s news</text>
    </g>

    <text x="280" y="338" font-size="11" font-style="italic" fill="#8a8580" text-anchor="middle">Web-search tool restores access to current information.</text>
  </g>

  <line x1="540" y1="80" x2="540" y2="430" stroke="#e0dcd6" stroke-width="1"/>

  <!-- RIGHT: context window scroll -->
  <g>
    <text x="580" y="84" font-size="11" font-weight="700" fill="#8a8580" letter-spacing="1.5">CONTEXT WINDOW</text>

    <!-- Three turns showing the scroll mechanic -->
    <g>
      <text x="650" y="118" font-size="10" font-weight="700" fill="#8a8580" text-anchor="middle">Turn 1</text>
      <rect x="600" y="125" width="100" height="50" rx="4" fill="#cfe1e0" stroke="#2b2826" stroke-width="1"/>
      <text x="650" y="155" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">input + output</text>
      <text x="650" y="167" font-size="9" fill="#8a8580" text-anchor="middle">fits comfortably</text>
    </g>

    <g>
      <text x="800" y="118" font-size="10" font-weight="700" fill="#8a8580" text-anchor="middle">Turn 50</text>
      <rect x="750" y="125" width="100" height="50" rx="4" fill="#f5e0c5" stroke="#2b2826" stroke-width="1"/>
      <text x="800" y="155" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">filling up</text>
      <text x="800" y="167" font-size="9" fill="#8a8580" text-anchor="middle">attention spreads</text>
    </g>

    <g>
      <text x="950" y="118" font-size="10" font-weight="700" fill="#8a8580" text-anchor="middle">Turn 200</text>
      <rect x="900" y="125" width="100" height="50" rx="4" fill="#fee0cf" stroke="#c03000" stroke-width="1.4"/>
      <text x="950" y="155" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">at the limit</text>
      <text x="950" y="167" font-size="9" fill="#8a8580" text-anchor="middle">old turns drop</text>
    </g>

    <!-- scissors and dropping out -->
    <text x="800" y="220" font-size="20" text-anchor="middle">✂</text>
    <line x1="600" y1="220" x2="780" y2="220" stroke="#c03000" stroke-width="1.2" stroke-dasharray="3,3"/>
    <line x1="820" y1="220" x2="1000" y2="220" stroke="#c03000" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="800" y="244" font-size="10" font-weight="700" fill="#c03000" text-anchor="middle">context limit — anything above is forgotten</text>

    <!-- window sizes table -->
    <g transform="translate(600 270)">
      <rect x="0" y="0" width="420" height="110" rx="6" fill="#ffffff" stroke="#8a8580" stroke-width="0.8"/>
      <text x="16" y="22" font-size="11" font-weight="700" fill="#2b2826" letter-spacing="1">CONTEXT WINDOW SIZES (2025)</text>
      <line x1="16" y1="34" x2="404" y2="34" stroke="#e0dcd6" stroke-width="0.8"/>
      <g font-size="12" fill="#2b2826">
        <text x="20" y="54">GPT-4 Turbo</text>
        <text x="404" y="54" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">128K tokens</text>
        <text x="20" y="74">Claude Sonnet 4.6</text>
        <text x="404" y="74" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">1M tokens</text>
        <text x="20" y="94">Gemini 1.5 Pro</text>
        <text x="404" y="94" font-family="IBM Plex Mono, monospace" text-anchor="end" font-weight="700">1M tokens</text>
      </g>
    </g>

    <text x="810" y="406" font-size="11" font-style="italic" fill="#8a8580" text-anchor="middle">Quadratic cost in length. Attention spreads thin near the top of the window.</text>
  </g>

  <!-- Bottom unified takeaway -->
  <g>
    <rect x="40" y="438" width="1020" height="32" rx="6" fill="#ffffff" stroke="#c03000" stroke-width="1.2"/>
    <text x="60" y="459" font-size="12" fill="#2b2826">Knowledge cutoff and context window are both reasons the model needs to <tspan font-weight="700" fill="#c03000">go outside itself</tspan>: retrieval for cutoff, summarisation or tools for length.</text>
  </g>
</svg>
