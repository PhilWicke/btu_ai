<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 540" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="600" height="540" fill="#f5f2ed"/>

  <text x="300" y="34" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">The RLHF loop</text>
  <text x="300" y="52" font-size="11" fill="#8a8580" text-anchor="middle">Generate, score, update, repeat. Millions of iterations gradually shift the LLM toward responses humans prefer.</text>

  <defs>
    <marker id="loopArrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <polygon points="0 0, 9 4.5, 0 9" fill="#c03000"/>
    </marker>
  </defs>

  <!-- Centre dot -->
  <circle cx="300" cy="270" r="4" fill="#8a8580"/>

  <!-- LLM (top) -->
  <g>
    <rect x="220" y="100" width="160" height="60" rx="10" fill="#cfe1e0" stroke="#2b2826" stroke-width="1.6"/>
    <text x="300" y="128" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">LLM</text>
    <text x="300" y="146" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">policy π<tspan baseline-shift="sub" font-size="8">θ</tspan></text>
  </g>

  <!-- Response (right) -->
  <g>
    <rect x="430" y="220" width="140" height="60" rx="10" fill="#ffffff" stroke="#2b2826" stroke-width="1.4"/>
    <text x="500" y="246" font-size="13" font-weight="700" fill="#2b2826" text-anchor="middle">Response y</text>
    <text x="500" y="264" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">generated for prompt x</text>
  </g>

  <!-- Reward model (bottom) -->
  <g>
    <rect x="220" y="380" width="160" height="60" rx="10" fill="#f5e0c5" stroke="#2b2826" stroke-width="1.6"/>
    <text x="300" y="408" font-size="14" font-weight="700" fill="#2b2826" text-anchor="middle">Reward model</text>
    <text x="300" y="426" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">scores r(x, y)</text>
  </g>

  <!-- PPO update (left) -->
  <g>
    <rect x="30" y="220" width="140" height="60" rx="10" fill="#fee0cf" stroke="#c03000" stroke-width="1.6"/>
    <text x="100" y="246" font-size="13" font-weight="700" fill="#2b2826" text-anchor="middle">PPO update</text>
    <text x="100" y="264" font-size="10" font-style="italic" fill="#2b2826" text-anchor="middle">on θ, with a KL leash</text>
  </g>

  <!-- Arrows forming the loop with animated dasharray flow -->
  <!-- LLM -> Response (top right) -->
  <path d="M 380 140 Q 460 175 460 220" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#loopArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="470" y="178" font-size="11" font-weight="700" fill="#c03000">generate</text>

  <!-- Response -> Reward (bottom right) -->
  <path d="M 500 280 Q 500 340 380 380" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#loopArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="470" y="350" font-size="11" font-weight="700" fill="#c03000">score</text>

  <!-- Reward -> PPO (bottom left) -->
  <path d="M 220 410 Q 130 410 100 280" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#loopArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="115" y="400" font-size="11" font-weight="700" fill="#c03000">reward signal</text>

  <!-- PPO -> LLM (top left) -->
  <path d="M 100 220 Q 100 140 220 140" stroke="#c03000" stroke-width="2.4" fill="none"
        marker-end="url(#loopArrow)" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.2s" repeatCount="indefinite"/>
  </path>
  <text x="130" y="178" font-size="11" font-weight="700" fill="#c03000">update θ</text>

  <!-- KL penalty annotation -->
  <g>
    <rect x="40" y="465" width="520" height="60" rx="6" fill="#ffffff" stroke="#8a8580" stroke-width="0.8"/>
    <text x="60" y="488" font-size="11" font-weight="700" fill="#2b2826" letter-spacing="1">OBJECTIVE</text>
    <text x="60" y="508" font-family="IBM Plex Mono, monospace" font-size="13" fill="#2b2826">
      maximise  𝔼[ r(x, y) ]  −  β · KL( π<tspan baseline-shift="sub" font-size="9">θ</tspan> ‖ π<tspan baseline-shift="sub" font-size="9">SFT</tspan> )
    </text>
    <text x="370" y="508" font-size="10" font-style="italic" fill="#8a8580">← the leash, prevents drift</text>
  </g>
</svg>
