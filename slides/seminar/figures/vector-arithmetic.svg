<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" font-family="Inter, -apple-system, sans-serif" preserveAspectRatio="xMidYMid meet">
  <rect width="800" height="500" fill="#f5f2ed"/>

  <text x="40" y="38" font-size="14" font-weight="700" fill="#2b2826">Analogy as parallelogram in embedding space</text>
  <text x="40" y="56" font-size="11" fill="#8a8580">king − man + woman ≈ queen. The gender direction is preserved across the analogy.</text>

  <!-- Faint axes -->
  <line x1="80" y1="450" x2="760" y2="450" stroke="#e0dcd6" stroke-width="1"/>
  <line x1="80" y1="120" x2="80" y2="450" stroke="#e0dcd6" stroke-width="1"/>
  <text x="757" y="467" font-size="10" font-style="italic" fill="#8a8580" text-anchor="end">embedding dimension 1</text>
  <text x="92" y="125" font-size="10" font-style="italic" fill="#8a8580">embedding dimension 2</text>

  <!-- Parallelogram (faint dashed) -->
  <polygon points="220,360 220,200 560,200 560,360" fill="none" stroke="#e0dcd6" stroke-width="1.2" stroke-dasharray="4,3"/>

  <!-- man → king direction (royalty axis) -->
  <line x1="238" y1="360" x2="540" y2="360" stroke="#8a8580" stroke-width="1.8" stroke-dasharray="3,3"/>
  <polygon points="548,360 536,355 536,365" fill="#8a8580"/>
  <text x="389" y="382" font-size="12" font-style="italic" fill="#8a8580" text-anchor="middle">royalty</text>

  <!-- woman → queen (parallel above) -->
  <line x1="238" y1="200" x2="540" y2="200" stroke="#8a8580" stroke-width="1.8" stroke-dasharray="3,3" opacity="0.45"/>
  <polygon points="548,200 536,195 536,205" fill="#8a8580" opacity="0.45"/>

  <!-- man → woman direction (gender axis) -->
  <line x1="220" y1="342" x2="220" y2="218" stroke="#c03000" stroke-width="2.2"/>
  <polygon points="220,210 215,222 225,222" fill="#c03000"/>
  <text x="190" y="290" font-size="12" font-style="italic" fill="#c03000" text-anchor="end">gender</text>

  <!-- king → queen direction (parallel) -->
  <line x1="560" y1="342" x2="560" y2="218" stroke="#c03000" stroke-width="2.2"/>
  <polygon points="560,210 555,222 565,222" fill="#c03000"/>

  <!-- Points (drawn on top) -->
  <circle cx="220" cy="360" r="6" fill="#2b2826"/>
  <text x="210" y="385" font-size="13" font-weight="600" fill="#2b2826" text-anchor="end">man</text>

  <circle cx="220" cy="200" r="6" fill="#2b2826"/>
  <text x="210" y="190" font-size="13" font-weight="600" fill="#2b2826" text-anchor="end">woman</text>

  <circle cx="560" cy="360" r="6" fill="#2b2826"/>
  <text x="570" y="385" font-size="13" font-weight="600" fill="#2b2826">king</text>

  <circle cx="560" cy="200" r="7" fill="#c03000"/>
  <text x="570" y="190" font-size="13" font-weight="700" fill="#c03000">queen ← predicted</text>

  <!-- Equation -->
  <text x="400" y="115" font-size="18" font-family="Lora, Georgia, serif" font-style="italic" fill="#2b2826" text-anchor="middle">king − man + woman ≈ queen</text>

  <!-- Other analogies -->
  <line x1="40" y1="470" x2="760" y2="470" stroke="#e0dcd6" stroke-width="1"/>
  <text x="40" y="487" font-size="11" fill="#8a8580" font-style="italic">other analogies: Paris − France + Germany ≈ Berlin   ·   walked − walk + swim ≈ swam   ·   bigger − big + small ≈ smaller</text>
</svg>
